openapi: 3.1.1
info:
  title: Party Registry Internal API
  version: 1.0.0
  description: >-
    Internal-only contract for tenant-scoped Party registration. Network isolation and caller
    authentication are upstream and deployment responsibilities; Tenant-Id and User-Id provide
    trusted context but are not authentication credentials.
servers: []
tags:
  - name: Parties
    description: Tenant-scoped civil and legal identity registration
paths:
  /internal/v1/parties:
    post:
      tags:
        - Parties
      operationId: createParty
      summary: Create a natural-person or legal-entity Party
      description: >-
        Creates the complete Party aggregate and, when enabled, its pending creation event in one
        atomic operation. Repeated context headers and server-owned fields in the body are rejected.
        The operation is non-idempotent and clients must not retry automatically after an uncertain
        transport outcome.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartyRequest'
            examples:
              minimalNaturalPerson:
                summary: Natural person with minimum required details
                value:
                  type: NATURAL_PERSON
                  naturalPersonDetails:
                    givenNames: Ana Maria
                    familyNames: Example
              legalEntity:
                summary: Legal entity with country of incorporation
                value:
                  type: LEGAL_ENTITY
                  legalEntityDetails:
                    legalName: Example Company
                    incorporationCountryCode: EC
      responses:
        '201':
          description: Party committed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePartyResponse'
              example:
                partyId: 0198ce2a-7b7d-7ab4-a5cf-4d4d7db89ab1
                version: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        '500':
          $ref: '#/components/responses/CreationFailure'
components:
  parameters:
    TenantId:
      name: Tenant-Id
      in: header
      required: true
      description: >-
        Trusted tenant context. Exactly one occurrence is required. Missing, malformed, or repeated
        values are INVALID_CONTEXT.
      schema:
        type: string
        format: uuid
    UserId:
      name: User-Id
      in: header
      required: true
      description: >-
        Trusted opaque audit subject. Exactly one non-blank occurrence is required. Missing, blank,
        oversized, or repeated values are INVALID_CONTEXT.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '.*\S.*'
  schemas:
    CreatePartyRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateNaturalPersonRequest'
        - $ref: '#/components/schemas/CreateLegalEntityRequest'
      discriminator:
        propertyName: type
        mapping:
          NATURAL_PERSON: '#/components/schemas/CreateNaturalPersonRequest'
          LEGAL_ENTITY: '#/components/schemas/CreateLegalEntityRequest'
    CreateNaturalPersonRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - naturalPersonDetails
      properties:
        type:
          type: string
          const: NATURAL_PERSON
        naturalPersonDetails:
          $ref: '#/components/schemas/NaturalPersonDetailsInput'
        nationalities:
          type: array
          maxItems: 10
          description: >-
            Optional nationalities. Omission means an empty collection. More than 10 entries are
            invalid Party data. Each country's interval must not overlap another interval for the
            same country, and primary intervals must not overlap each other. Supplied bounds are
            inclusive, so intervals sharing an endpoint overlap. Active-at-registration checks use
            the service's trusted UTC business date captured when command processing starts.
          items:
            $ref: '#/components/schemas/NationalityInput'
          default: []
    CreateLegalEntityRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - legalEntityDetails
      properties:
        type:
          type: string
          const: LEGAL_ENTITY
        legalEntityDetails:
          $ref: '#/components/schemas/LegalEntityDetailsInput'
    NaturalPersonDetailsInput:
      type: object
      additionalProperties: false
      required:
        - givenNames
        - familyNames
      properties:
        givenNames:
          type: string
          minLength: 1
          maxLength: 200
        familyNames:
          type: string
          minLength: 1
          maxLength: 200
        preferredName:
          type:
            - string
            - 'null'
          maxLength: 200
          description: Omission and explicit null both mean not supplied.
        birthDate:
          type:
            - string
            - 'null'
          format: date
          description: >-
            Omission and explicit null both mean not supplied. When dateOfDeath is present,
            birthDate must not be later.
        dateOfDeath:
          type:
            - string
            - 'null'
          format: date
          description: >-
            Omission and explicit null both mean not supplied. It must not precede birthDate when
            both dates are present.
        birthCountryCode:
          $ref: '#/components/schemas/NullableCountryCode'
    LegalEntityDetailsInput:
      type: object
      additionalProperties: false
      required:
        - legalName
        - incorporationCountryCode
      properties:
        legalName:
          type: string
          minLength: 1
          maxLength: 300
        tradeName:
          type:
            - string
            - 'null'
          maxLength: 300
          description: Omission and explicit null both mean not supplied.
        legalFormCode:
          type:
            - string
            - 'null'
          maxLength: 64
          description: Omission and explicit null both mean not supplied.
        incorporationCountryCode:
          $ref: '#/components/schemas/CountryCode'
        incorporatedOn:
          type:
            - string
            - 'null'
          format: date
          description: >-
            Omission and explicit null both mean not supplied. It must not be later than
            dissolvedOn when both dates are present.
        dissolvedOn:
          type:
            - string
            - 'null'
          format: date
          description: >-
            Omission and explicit null both mean not supplied. It must not precede incorporatedOn
            when both dates are present.
    NationalityInput:
      type: object
      additionalProperties: false
      required:
        - countryCode
      properties:
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        isPrimary:
          type: boolean
          default: false
          description: Omission means false.
        validFrom:
          type:
            - string
            - 'null'
          format: date
          description: >-
            Omission and explicit null mean an open lower validity bound. A supplied date is an
            inclusive boundary.
        validUntil:
          type:
            - string
            - 'null'
          format: date
          description: >-
            Omission and explicit null mean an open upper validity bound. A supplied date is an
            inclusive boundary, so it overlaps another interval beginning on the same date. It must
            not precede validFrom when both dates are present.
    CountryCode:
      type: string
      pattern: '^[A-Z]{2}$'
      description: ISO 3166-1 alpha-2 code, confirmed active before persistence
    NullableCountryCode:
      type:
        - string
        - 'null'
      pattern: '^[A-Z]{2}$'
      description: >-
        Optional ISO 3166-1 alpha-2 code, confirmed active when supplied. Omission and explicit null
        both mean not supplied.
    CreatePartyResponse:
      type: object
      additionalProperties: false
      required:
        - partyId
        - version
      properties:
        partyId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          const: 0
    ProblemBase:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: Must equal the HTTP response status.
        detail:
          type: string
          description: Sanitized detail without rejected personal values or provider internals
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        traceId:
          type: string
          description: Opaque diagnostic trace identifier when available
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
    Violation:
      type: object
      additionalProperties: false
      required:
        - code
        - location
      properties:
        code:
          type: string
        location:
          type: string
          enum:
            - header
            - body
        path:
          type: string
          description: Header name or JSON path; never contains a rejected value
    InvalidContextProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          properties:
            type:
              const: 'urn:party-registry:problem:invalid-context'
            status:
              const: 400
            code:
              const: INVALID_CONTEXT
      unevaluatedProperties: false
    MalformedRequestProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          properties:
            type:
              const: 'urn:party-registry:problem:malformed-request'
            status:
              const: 400
            code:
              const: MALFORMED_REQUEST
      unevaluatedProperties: false
    UnsupportedMediaTypeProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          properties:
            type:
              const: 'urn:party-registry:problem:unsupported-media-type'
            status:
              const: 415
            code:
              const: UNSUPPORTED_MEDIA_TYPE
      unevaluatedProperties: false
    InvalidPartyDataProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          properties:
            type:
              const: 'urn:party-registry:problem:invalid-party-data'
            status:
              const: 422
            code:
              const: INVALID_PARTY_DATA
      unevaluatedProperties: false
    InvalidGeographicReferenceProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          properties:
            type:
              const: 'urn:party-registry:problem:invalid-geographic-reference'
            status:
              const: 422
            code:
              const: INVALID_GEOGRAPHIC_REFERENCE
      unevaluatedProperties: false
    DependencyUnavailableProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          properties:
            type:
              const: 'urn:party-registry:problem:dependency-unavailable'
            status:
              const: 503
            code:
              const: DEPENDENCY_UNAVAILABLE
      unevaluatedProperties: false
    CreationFailureProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          properties:
            type:
              const: 'urn:party-registry:problem:creation-failure'
            status:
              const: 500
            code:
              const: CREATION_FAILURE
      unevaluatedProperties: false
  responses:
    BadRequest:
      description: Invalid context or malformed request
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/InvalidContextProblem'
              - $ref: '#/components/schemas/MalformedRequestProblem'
          examples:
            invalidContext:
              value:
                type: 'urn:party-registry:problem:invalid-context'
                title: Invalid request context
                status: 400
                code: INVALID_CONTEXT
                detail: A required context header is missing or invalid.
            malformedRequest:
              value:
                type: 'urn:party-registry:problem:malformed-request'
                title: Malformed request
                status: 400
                code: MALFORMED_REQUEST
                detail: The request body is not valid JSON.
    UnsupportedMediaType:
      description: Request media type is not application/json
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UnsupportedMediaTypeProblem'
          example:
            type: 'urn:party-registry:problem:unsupported-media-type'
            title: Unsupported media type
            status: 415
            code: UNSUPPORTED_MEDIA_TYPE
            detail: Content-Type must be application/json.
    UnprocessableContent:
      description: Invalid Party data or explicitly invalid geographic reference
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/InvalidPartyDataProblem'
              - $ref: '#/components/schemas/InvalidGeographicReferenceProblem'
          examples:
            invalidPartyData:
              value:
                type: 'urn:party-registry:problem:invalid-party-data'
                title: Invalid Party data
                status: 422
                code: INVALID_PARTY_DATA
                detail: The Party data violates one or more creation rules.
            invalidGeographicReference:
              value:
                type: 'urn:party-registry:problem:invalid-geographic-reference'
                title: Invalid geographic reference
                status: 422
                code: INVALID_GEOGRAPHIC_REFERENCE
                detail: One or more country references are unknown or inactive.
    DependencyUnavailable:
      description: Geographic validation could not complete authoritatively
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/DependencyUnavailableProblem'
          example:
            type: 'urn:party-registry:problem:dependency-unavailable'
            title: Dependency unavailable
            status: 503
            code: DEPENDENCY_UNAVAILABLE
            detail: Country validation could not be completed.
    CreationFailure:
      description: Creation failed and the local transaction was rolled back
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CreationFailureProblem'
          example:
            type: 'urn:party-registry:problem:creation-failure'
            title: Party creation failed
            status: 500
            code: CREATION_FAILURE
            detail: Party creation did not complete.
