quarkus.application.name=party-registry-service

# One PostgreSQL datasource serves two deliberately separate access paths:
# Vert.x/Hibernate Reactive for request processing and JDBC for Flyway only.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.transactions=disabled
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=2
quarkus.datasource.reactive.max-size=20
quarkus.datasource.reactive.cache-prepared-statements=true
quarkus.datasource.health.enabled=true
quarkus.datasource.metrics.enabled=true

quarkus.flyway.locations=db/migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.validate-migration-naming=true
quarkus.flyway.clean-disabled=true

# Flyway is the exclusive schema authority in every profile.
quarkus.hibernate-orm.schema-management.strategy=validate

# The approved static contract is copied to META-INF/openapi.yaml by Gradle.
mp.openapi.scan.disable=true
quarkus.smallrye-openapi.path=openapi
quarkus.swagger-ui.always-include=false

quarkus.micrometer.export.prometheus.path=metrics
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.exporter=${OTEL_TRACES_EXPORTER:none}

# SecureRandom must be seeded when the native executable starts, not while its image is built.
quarkus.native.additional-build-args=--initialize-at-run-time=com.alexastudillo.partyregistry.application.support.UuidV7

# Treat API request models as closed JSON schemas and let the shared mapper handle malformed input.
quarkus.jackson.fail-on-unknown-properties=true
quarkus.rest.exception-mapping.disable-mapper-for=io.quarkus.resteasy.reactive.jackson.runtime.mappers.BuiltinMismatchedInputExceptionMapper

# Normalize failures raised before Quarkus REST dispatches business API requests.
api-response.errors.http-failure-handler.enabled=true
api-response.errors.http-failure-handler.path=/v1/*
api-response.errors.authentication-challenge.enabled=${API_JSON_AUTHENTICATION_CHALLENGE_ENABLED:false}
api-response.errors.authentication-challenge.path-prefix=/v1/
api-response.errors.authentication-challenge.scheme=Bearer

# Bound every non-blocking Geographic Reference REST call. Quarkus expects milliseconds.
quarkus.rest-client.geographic-reference.connect-timeout=${GEOGRAPHIC_REFERENCE_CONNECT_TIMEOUT_MS:2000}
quarkus.rest-client.geographic-reference.read-timeout=${GEOGRAPHIC_REFERENCE_READ_TIMEOUT_MS:5000}
quarkus.rest-client.geographic-reference.disable-default-mapper=true

quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3}] (%t) [pid=%X{processId}] [userId=%X{userId}] [tenantId=%X{tenantId}] %s%e%n

# Development profile defaults are local and remain overridable through environment variables.
%dev.quarkus.datasource.username=${DEV_DB_USERNAME:party_registry}
%dev.quarkus.datasource.password=${DEV_DB_PASSWORD:party_registry}
%dev.quarkus.datasource.reactive.url=${DEV_DB_REACTIVE_URL:postgresql://localhost:5432/party_registry}
%dev.quarkus.datasource.jdbc.url=${DEV_DB_JDBC_URL:jdbc:postgresql://localhost:5432/party_registry}
%dev.quarkus.rest-client.geographic-reference.url=${DEV_GEOGRAPHIC_REFERENCE_BASE_URL:http://localhost:8081}

# Tests use an isolated PostgreSQL Dev Service unless standard Quarkus datasource variables override it.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=${TEST_DB_IMAGE:postgres:18-alpine}
%test.quarkus.datasource.devservices.reuse=false
%test.quarkus.datasource.username=${TEST_DB_USERNAME:party_registry_test}
%test.quarkus.datasource.password=${TEST_DB_PASSWORD:party_registry_test}
%test.quarkus.otel.traces.exporter=none
%test.quarkus.rest-client.geographic-reference.url=${TEST_GEOGRAPHIC_REFERENCE_BASE_URL:http://localhost:8081}

# Production has no credential, database connection, or service URL fallback.
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.reactive.url=${DB_REACTIVE_URL}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%prod.quarkus.rest-client.geographic-reference.url=${GEOGRAPHIC_REFERENCE_BASE_URL}
