quarkus.application.name=party-registry-service
# One PostgreSQL datasource serves two deliberately separate access paths:
# Vert.x/Hibernate Reactive for request processing and JDBC for Flyway only.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.transactions=disabled
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=2
quarkus.datasource.reactive.max-size=20
quarkus.datasource.reactive.cache-prepared-statements=true
quarkus.datasource.health.enabled=true
quarkus.datasource.metrics.enabled=true
quarkus.flyway.locations=db/migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.validate-migration-naming=true
quarkus.flyway.clean-disabled=true
# Flyway is the exclusive schema authority in every profile.
quarkus.hibernate-orm.schema-management.strategy=validate
# The approved static contract is copied to META-INF/openapi.yaml by Gradle.
mp.openapi.scan.disable=true
quarkus.smallrye-openapi.path=openapi
quarkus.swagger-ui.always-include=false
quarkus.micrometer.export.prometheus.path=metrics
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.exporter=${OTEL_TRACES_EXPORTER:none}
# SecureRandom must be seeded when the native executable starts, not while its image is built.
quarkus.native.additional-build-args=--initialize-at-run-time=com.alexastudillo.partyregistry.application.support.UuidV7
# Treat API request models as closed JSON schemas and let the shared mapper handle malformed input.
quarkus.jackson.fail-on-unknown-properties=true
quarkus.rest.exception-mapping.disable-mapper-for=io.quarkus.resteasy.reactive.jackson.runtime.mappers.BuiltinMismatchedInputExceptionMapper
# Normalize failures raised before Quarkus REST dispatches business API requests.
api-response.errors.http-failure-handler.enabled=true
api-response.errors.http-failure-handler.path=/v1/*
api-response.errors.authentication-challenge.enabled=${API_JSON_AUTHENTICATION_CHALLENGE_ENABLED:false}
api-response.errors.authentication-challenge.path-prefix=/v1/
api-response.errors.authentication-challenge.scheme=Bearer
# Bound every non-blocking Geographic Reference REST call. Quarkus expects milliseconds.
quarkus.rest-client.geographic-reference.connect-timeout=${GEOGRAPHIC_REFERENCE_CONNECT_TIMEOUT_MS:2000}
quarkus.rest-client.geographic-reference.read-timeout=${GEOGRAPHIC_REFERENCE_READ_TIMEOUT_MS:5000}
quarkus.rest-client.geographic-reference.disable-default-mapper=true
# Identifier protection keys have no source-controlled development or production defaults.
party-registry.identifier-protection.encryption-keys.1=${PARTY_IDENTIFIER_ENCRYPTION_KEY_V1}
party-registry.identifier-protection.current-encryption-key-version=${PARTY_IDENTIFIER_CURRENT_ENCRYPTION_KEY_VERSION}
party-registry.identifier-protection.index-hmac-key=${PARTY_IDENTIFIER_INDEX_HMAC_KEY}
party-registry.idempotency.registration-hmac-key=${PARTY_REGISTRATION_IDEMPOTENCY_HMAC_KEY}
# Provision party-registry.pagination.current-signing-key-id and signing-keys.<id> externally.
# Cursor keys are independent Base64-encoded 256-bit secrets; retain older verification keys during rotation.
party-registry.pagination.current-signing-key-id=${PARTY_CURSOR_CURRENT_SIGNING_KEY_ID:v1}
party-registry.pagination.signing-keys.v1=${PARTY_CURSOR_SIGNING_KEY_V1}
party-registry.queries.statement-timeout=${PARTY_QUERY_STATEMENT_TIMEOUT:5s}
party-registry.queries.traversal-timeout=${PARTY_QUERY_TRAVERSAL_TIMEOUT:15s}
party-registry.mutations.lock-timeout=${PARTY_MUTATION_LOCK_TIMEOUT:5s}
party-registry.mutations.statement-timeout=${PARTY_MUTATION_STATEMENT_TIMEOUT:10s}
party-registry.mutations.operation-timeout=${PARTY_MUTATION_OPERATION_TIMEOUT:15s}
party-registry.outbox.mode=${PARTY_OUTBOX_MODE:disabled}
party-registry.outbox.publisher.poll-interval=${PARTY_OUTBOX_POLL_INTERVAL:5s}
party-registry.outbox.publisher.batch-size=${PARTY_OUTBOX_BATCH_SIZE:25}
party-registry.outbox.publisher.publish-timeout=${PARTY_OUTBOX_PUBLISH_TIMEOUT:5s}
party-registry.outbox.publisher.claim-lease=${PARTY_OUTBOX_CLAIM_LEASE:30s}
party-registry.outbox.publisher.initial-backoff=${PARTY_OUTBOX_INITIAL_BACKOFF:1s}
party-registry.outbox.publisher.maximum-backoff=${PARTY_OUTBOX_MAXIMUM_BACKOFF:5m}
party-registry.outbox.publisher.maximum-attempts=${PARTY_OUTBOX_MAXIMUM_ATTEMPTS:10}
# The emitter Uni completes on broker acknowledgement because confirms are explicitly enabled.
mp.messaging.outgoing.party-outbox.connector=smallrye-rabbitmq
mp.messaging.outgoing.party-outbox.exchange.name=${PARTY_OUTBOX_EXCHANGE:party.events}
mp.messaging.outgoing.party-outbox.exchange.type=topic
mp.messaging.outgoing.party-outbox.exchange.durable=true
mp.messaging.outgoing.party-outbox.default-routing-key=${PARTY_OUTBOX_ROUTING_KEY:party.events}
mp.messaging.outgoing.party-outbox.publish-confirms=true
mp.messaging.outgoing.party-outbox.retry-on-fail-attempts=0
mp.messaging.outgoing.party-outbox.max-inflight-messages=${PARTY_OUTBOX_BATCH_SIZE:25}
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3}] (%t) [pid=%X{processId}] [userId=%X{userId}] [tenantId=%X{tenantId}] %s%e%n
# Development profile defaults are local and remain overridable through environment variables.
%dev.quarkus.datasource.username=${DEV_DB_USERNAME:party_registry_runtime}
%dev.quarkus.datasource.password=${DEV_DB_PASSWORD:party_registry}
%dev.quarkus.flyway.username=${DEV_FLYWAY_DB_USERNAME:party_registry_migration}
%dev.quarkus.flyway.password=${DEV_FLYWAY_DB_PASSWORD:party_registry}
%dev.quarkus.datasource.reactive.url=${DEV_DB_REACTIVE_URL:postgresql://localhost:15432/party_registry_service}
%dev.quarkus.datasource.jdbc.url=${DEV_DB_JDBC_URL:jdbc:postgresql://localhost:15432/party_registry_service}
%dev.quarkus.http.port=${DEV_HTTP_PORT:8082}
%dev.quarkus.rest-client.geographic-reference.url=${DEV_GEOGRAPHIC_REFERENCE_BASE_URL:http://localhost:8081}
%dev.quarkus.rabbitmq.devservices.enabled=false
# Tests use an isolated PostgreSQL Dev Service unless standard Quarkus datasource variables override it.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.rabbitmq.devservices.enabled=false
%test.quarkus.datasource.devservices.image-name=${TEST_DB_IMAGE:postgres:18-alpine}
%test.quarkus.datasource.devservices.reuse=false
%test.quarkus.datasource.username=${TEST_DB_USERNAME:party_registry_test}
%test.quarkus.datasource.password=${TEST_DB_PASSWORD:party_registry_test}
%test.quarkus.flyway.locations=db/migration,db/test-migration
%test.quarkus.otel.traces.exporter=none
%test.quarkus.rest-client.geographic-reference.url=${TEST_GEOGRAPHIC_REFERENCE_BASE_URL:http://localhost:8081}
%test.party-registry.identifier-protection.encryption-keys.1=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
%test.party-registry.identifier-protection.current-encryption-key-version=1
%test.party-registry.identifier-protection.index-hmac-key=YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODk=
%test.party-registry.idempotency.registration-hmac-key=ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
# Deterministic cursor material is restricted to the isolated JVM/packaged/native test profile.
%test.party-registry.pagination.current-signing-key-id=test-v1
%test.party-registry.pagination.signing-keys.test-v1=Y3Vyc29yLWtleS12MS0wMTIzNDU2Nzg5YWJjZGVmMDE=
%test.party-registry.pagination.signing-keys.v1=Y3Vyc29yLWtleS12MS0wMTIzNDU2Nzg5YWJjZGVmMDE=
%test.party-registry.outbox.mode=disabled
%test.party-registry.error-verification.enabled=true
# Production has no credential, database connection, or service URL fallback.
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.flyway.username=${FLYWAY_DB_USERNAME}
%prod.quarkus.flyway.password=${FLYWAY_DB_PASSWORD}
%prod.quarkus.datasource.reactive.url=${DB_REACTIVE_URL}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%prod.quarkus.rest-client.geographic-reference.url=${GEOGRAPHIC_REFERENCE_BASE_URL}
%prod.rabbitmq-host=${RABBITMQ_HOST}
%prod.rabbitmq-port=${RABBITMQ_PORT:5672}
%prod.rabbitmq-username=${RABBITMQ_USERNAME}
%prod.rabbitmq-password=${RABBITMQ_PASSWORD}
%prod.rabbitmq-virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
