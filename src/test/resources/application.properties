quarkus.datasource.db-kind=postgresql
quarkus.datasource.db-version=18.0
quarkus.datasource.username=overridden-by-postgresql-test-resource
quarkus.datasource.password=overridden-by-postgresql-test-resource
quarkus.datasource.reactive.url=vertx-reactive:postgresql://localhost:1/overridden-by-postgresql-test-resource
quarkus.datasource.jdbc=false
quarkus.datasource.devservices.enabled=false

quarkus.datasource.flyway.db-kind=postgresql
quarkus.datasource.flyway.reactive=false
quarkus.datasource.flyway.jdbc.transactions=disabled
quarkus.datasource.flyway.devservices.enabled=false

quarkus.flyway.flyway.migrate-at-start=true
quarkus.otel.sdk.disabled=true
