name: Deploy native image to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: party-registry-service-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build_publish:
    name: Build native image and publish it
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.reference }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build the Linux native executable
        run: >-
          ./gradlew --no-daemon clean build
          -Dquarkus.native.enabled=true
          -Dquarkus.package.jar.enabled=false
          -Dquarkus.native.container-build=true
          -Dquarkus.native.container-runtime=docker
          -Dquarkus.native.march=compatibility
          -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25

      - name: Build and publish the container image
        id: publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          image_repository="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          image_reference="${image_repository}:sha-${GITHUB_SHA}"
          latest_reference="${image_repository}:latest"

          printf '%s' "${GHCR_TOKEN}" |
            docker login "${REGISTRY}" --username "${GITHUB_ACTOR}" --password-stdin

          docker build \
            --platform linux/amd64 \
            --file src/main/docker/Dockerfile.native \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${image_reference}" \
            .

          docker push "${image_reference}"
          docker tag "${image_reference}" "${latest_reference}"
          docker push "${latest_reference}"

          printf 'reference=%s\n' "${image_reference}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy the image with rootless Podman Quadlet
    if: github.ref == 'refs/heads/main'
    needs:
      - build_publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: read

    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6

      - name: Install the Quadlet on the VPS
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ needs.build_publish.outputs.image }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_PORT: "22"
        run: |
          set -Eeuo pipefail

          : "${IMAGE_REFERENCE:?The native image reference is missing}"
          : "${VPS_HOST:?Define the VPS_HOST production secret}"
          : "${VPS_USER:?Define the VPS_USER production secret}"
          : "${VPS_SSH_PRIVATE_KEY:?Define the VPS_SSH_PRIVATE_KEY production secret}"
          : "${VPS_SSH_KNOWN_HOSTS:?Define the VPS_SSH_KNOWN_HOSTS production secret}"

          ssh_key_file="${RUNNER_TEMP}/vps-deploy-key"
          known_hosts_file="${RUNNER_TEMP}/vps-known-hosts"
          remote="${VPS_USER}@${VPS_HOST}"
          remote_stage=".local/share/geographic-reference-service"

          (
            umask 077
            printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > "${ssh_key_file}"
            printf '%s\n' "${VPS_SSH_KNOWN_HOSTS}" > "${known_hosts_file}"
          )

          ssh_options=(
            -i "${ssh_key_file}"
            -p "${VPS_SSH_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${known_hosts_file}"
          )
          scp_options=(
            -i "${ssh_key_file}"
            -P "${VPS_SSH_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${known_hosts_file}"
          )

          ssh "${ssh_options[@]}" "${remote}" \
            "install -d -m 700 '${remote_stage}'"

          scp "${scp_options[@]}" \
            deploy/quadlet/geographic-reference-service.container.template \
            deploy/vps/deploy.sh \
            "${remote}:${remote_stage}/"

          ssh "${ssh_options[@]}" "${remote}" \
            "chmod 700 '${remote_stage}/deploy.sh' && '${remote_stage}/deploy.sh' '${IMAGE_REFERENCE}'"