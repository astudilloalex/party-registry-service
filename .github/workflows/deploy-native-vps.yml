name: Deploy native image to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: party-registry-service-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


jobs:
  build_publish:
    name: Build native image and publish it
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.reference }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify deployment rendering and recovery
        shell: bash
        run: |
          python3 -m unittest discover -s deploy/tests -v
          bash -n deploy/vps/deploy.sh

      - name: Build the Linux native executable
        run: >-
          ./gradlew --no-daemon clean build
          -Dquarkus.native.enabled=true
          -Dquarkus.package.jar.enabled=false
          -Dquarkus.native.container-build=true
          -Dquarkus.native.container-runtime=docker
          -Dquarkus.native.march=compatibility
          -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25

      - name: Build and publish the container image
        id: publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          image_repository="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          image_reference="${image_repository}:sha-${GITHUB_SHA}"
          latest_reference="${image_repository}:latest"

          printf '%s' "${GHCR_TOKEN}" |
            docker login "${REGISTRY}" --username "${GITHUB_ACTOR}" --password-stdin

          docker build \
            --platform linux/amd64 \
            --file src/main/docker/Dockerfile.native \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${image_reference}" \
            .

          docker push "${image_reference}"
          docker tag "${image_reference}" "${latest_reference}"
          docker push "${latest_reference}"

          printf 'reference=%s\n' "${image_reference}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy the image with rootless Podman Quadlet
    if: github.ref == 'refs/heads/main'
    needs:
      - build_publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: read

    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6

      - name: Render the production environment
        shell: bash
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          FLYWAY_DB_PASSWORD: ${{ secrets.FLYWAY_DB_PASSWORD }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          PARTY_IDENTIFIER_ENCRYPTION_KEY_V1: ${{ secrets.PARTY_IDENTIFIER_ENCRYPTION_KEY_V1 }}
          PARTY_IDENTIFIER_INDEX_HMAC_KEY: ${{ secrets.PARTY_IDENTIFIER_INDEX_HMAC_KEY }}
          PARTY_REGISTRATION_IDEMPOTENCY_HMAC_KEY: ${{ secrets.PARTY_REGISTRATION_IDEMPOTENCY_HMAC_KEY }}
          PARTY_CURSOR_SIGNING_KEY_V1: ${{ secrets.PARTY_CURSOR_SIGNING_KEY_V1 }}
          DB_USERNAME: ${{ secrets.DB_USERNAME || vars.DB_USERNAME }}
          FLYWAY_DB_USERNAME: ${{ secrets.FLYWAY_DB_USERNAME || vars.FLYWAY_DB_USERNAME }}
          DB_REACTIVE_URL: ${{ secrets.DB_REACTIVE_URL || vars.DB_REACTIVE_URL }}
          DB_JDBC_URL: ${{ secrets.DB_JDBC_URL || vars.DB_JDBC_URL }}
          GEOGRAPHIC_REFERENCE_BASE_URL: ${{ secrets.GEOGRAPHIC_REFERENCE_BASE_URL || vars.GEOGRAPHIC_REFERENCE_BASE_URL }}
          RABBITMQ_HOST: ${{ secrets.RABBITMQ_HOST || vars.RABBITMQ_HOST }}
          RABBITMQ_PORT: ${{ secrets.RABBITMQ_PORT || vars.RABBITMQ_PORT }}
          RABBITMQ_VIRTUAL_HOST: ${{ secrets.RABBITMQ_VIRTUAL_HOST || vars.RABBITMQ_VIRTUAL_HOST }}
          PARTY_OUTBOX_MODE: ${{ secrets.PARTY_OUTBOX_MODE || vars.PARTY_OUTBOX_MODE }}
          PARTY_OUTBOX_EXCHANGE: ${{ secrets.PARTY_OUTBOX_EXCHANGE || vars.PARTY_OUTBOX_EXCHANGE }}
          PARTY_OUTBOX_ROUTING_KEY: ${{ secrets.PARTY_OUTBOX_ROUTING_KEY || vars.PARTY_OUTBOX_ROUTING_KEY }}
        run: |
          set -Eeuo pipefail
          python3 deploy/vps/render-env.py \
            deploy/quadlet/party-registry-service.env.example \
            "${RUNNER_TEMP}/party-registry-service.env"

      - name: Install the environment and Quadlet on the VPS
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ needs.build_publish.outputs.image }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_PORT: "22"
        run: |
          set -Eeuo pipefail

          : "${IMAGE_REFERENCE:?The native image reference is missing}"
          : "${VPS_HOST:?Define the VPS_HOST production secret}"
          : "${VPS_USER:?Define the VPS_USER production secret}"
          : "${VPS_SSH_PRIVATE_KEY:?Define the VPS_SSH_PRIVATE_KEY production secret}"
          : "${VPS_SSH_KNOWN_HOSTS:?Define the VPS_SSH_KNOWN_HOSTS production secret}"

          ssh_key_file="${RUNNER_TEMP}/vps-deploy-key"
          known_hosts_file="${RUNNER_TEMP}/vps-known-hosts"
          remote="${VPS_USER}@${VPS_HOST}"
          remote_stage=".local/share/party-registry-service/deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          (
            umask 077
            printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > "${ssh_key_file}"
            printf '%s\n' "${VPS_SSH_KNOWN_HOSTS}" > "${known_hosts_file}"
          )

          ssh_options=(
            -i "${ssh_key_file}"
            -p "${VPS_SSH_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${known_hosts_file}"
          )
          scp_options=(
            -i "${ssh_key_file}"
            -P "${VPS_SSH_PORT}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${known_hosts_file}"
          )

          cleanup_remote_stage() {
            ssh "${ssh_options[@]}" "${remote}" \
              "rm -f '${remote_stage}/party-registry-service.env' '${remote_stage}/party-registry-service.container.template' '${remote_stage}/deploy.sh'; rmdir '${remote_stage}'" || true
          }
          trap cleanup_remote_stage EXIT

          ssh "${ssh_options[@]}" "${remote}" \
            "install -d -m 700 '${remote_stage}'"

          scp "${scp_options[@]}" \
            deploy/quadlet/party-registry-service.container.template \
            deploy/vps/deploy.sh \
            "${RUNNER_TEMP}/party-registry-service.env" \
            "${remote}:${remote_stage}/"

          ssh "${ssh_options[@]}" "${remote}" \
            "chmod 700 '${remote_stage}/deploy.sh' && chmod 600 '${remote_stage}/party-registry-service.env' && '${remote_stage}/deploy.sh' '${IMAGE_REFERENCE}' '${remote_stage}' '${remote_stage}/party-registry-service.env'"

      - name: Remove temporary deployment credentials
        if: always()
        shell: bash
        run: |
          rm -f -- \
            "${RUNNER_TEMP}/party-registry-service.env" \
            "${RUNNER_TEMP}/vps-deploy-key" \
            "${RUNNER_TEMP}/vps-known-hosts"
