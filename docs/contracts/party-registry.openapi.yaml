      description: >-
        Strict natural-person creation representation. Exactly one initial official identifier is
        required and participates in idempotency comparison. Unknown properties are rejected.
        Omitted or null display names are derived from the validated given and family names.
        Names and explicit displayName accept mixed case and surrounding whitespace removed by Java String.strip()
        (Character.isWhitespace), then are stored as strip().toUpperCase(Locale.ROOT).
        For text fields, x-normalized-max-length counts normalized UTF-16 code units, not raw input;
        uppercase expansion counts toward the limit and surrounding whitespace does not.
        Required names must remain nonblank after normalization. Dates and initial identifier fields
        are not normalized by this rule. Original submitted strings remain the idempotency input.
      required:
        - givenNames
        - familyNames
