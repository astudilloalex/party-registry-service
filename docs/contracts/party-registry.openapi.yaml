  /v1/parties/{partyId}/nationalities:
    parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProcessId'
      - $ref: '#/components/parameters/UserId'
    post:
      tags:
        - nationalities
      operationId: createNationality
      summary: Register a Party nationality
      description: |
        Registers a nationality for either tenant-owned Party type in any retained lifecycle state,
        including ARCHIVED. Validates exactly one required Idempotency-Key and a strict JSON object;
        missing/null bodies return 400 request-body-required, missing/null countryCode returns 400
        country-code-required, and non-ASCII or malformed codes return 400 country-code-invalid.
        Unknown or repeated properties, wrong JSON types and invalid ISO calendar dates return
        400 bad-request. Strips only surrounding Java String.strip() whitespace, accepts two ASCII
        letters in either case and stores uppercase countryCode. Omitted isPrimary means false;
        explicit null is invalid. Missing/null dates are open bounds; provided dates are inclusive.
        Equal dates form a single day, future starts and historical ends are allowed. An end before
        the start returns 422 nationality-validity-invalid. Same-country overlapping periods return
        409 nationality-validity-conflict; overlapping primary periods return 409 primary-nationality-conflict.
        For a new request, verifies tenant Party ownership before asking Geographic Reference whether
        the code is recognized (inactive but recognized countries remain eligible); a definite miss
        returns 422 unrecognized-nationality-country, and an unavailable/unusable response returns
        503 dependency-unavailable. Failed attempts consume no key or record.
        The tenant and create action scope the key. Effective input is Party ID, normalized code,
        boolean primary flag and nullable dates, excluding User-Id and Process-Id. Equivalent
        completed retries return the original 201 body, ID and audit timestamps without a country
        lookup or write; changed input returns 409 idempotency-key-conflict before current-state
        checks, even for another Party. The accepted Process-Id is echoed for each attempt.
      parameters:
        - $ref: '#/components/parameters/NationalityCreateIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NationalityCreateRequest'
      responses:
        '201':
          description: Newly created or completed equivalent historical result
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessIdEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalityApiResponse'
              example:
                status: 201
                code: successful
                data:
                  nationalityId: 0198ce2a-7b7d-7ab4-a5cf-4d4d7db89ab1
                  partyId: 0198ce2b-d6a3-7d6e-80ba-d97b21d793e5
                  countryCode: EC
                  isPrimary: false
                  createdAt: '2026-09-23T10:00:00Z'
                  updatedAt: '2026-09-23T10:00:00Z'
        '400':
          $ref: '#/components/responses/NationalityBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NationalityNotFound'
        '409':
          $ref: '#/components/responses/NationalityConflict'
        '422':
          $ref: '#/components/responses/NationalityUnprocessableEntity'
        '405':
          $ref: '#/components/responses/NationalityMethodNotAllowed'
        '415':
          $ref: '#/components/responses/NationalityUnsupportedMediaType'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        default:
          $ref: '#/components/responses/DefaultError'
    get:
      tags:
        - nationalities
      operationId: listNationalities
      summary: List tenant-owned Party nationalities
      description: |
        Accepts exactly the six declared query parameters, each at most once. Unknown, repeated,
        blank, malformed, noncanonical or out-of-range values return 400 bad-request. The filters
        intersect (AND): validFrom is null or no later than the single UTC asOfDate captured for
        this request (future starts are always excluded); unless includeExpired=true, validUntil is
        null or no earlier than that date. includeExpired=true also includes ended rows. isPrimary
        filters the stored designation, including expired records; countryCode matches the stored
        uppercase code. Reads never revalidate the country reference. Results are ordered by
        createdAt DESC then nationalityId DESC. Count, page and navigation share a repeatable-read
        snapshot. A signed opaque cursor binds tenant, Party, normalized filters, evaluation date
        and limit; changed scope or altered tokens return 400 bad-request. A default date captured
        after UTC midnight invalidates yesterday's cursor; supply a fixed asOfDate to cross midnight.
        Forward/backward traversal over unchanged data has no gaps; an immutable snapshot across
        separate requests is not promised. Metadata counts all tenant-owned matches before the
        cursor position; empty data has zero counts and explicit null nextCursor/prevCursor.
      parameters:
        - name: countryCode
          in: query
          required: false
          description: Exactly two uppercase ASCII letters, with no trimming or case conversion.
          schema:
            type: string
            pattern: '^[A-Z]{2}$'
        - name: isPrimary
          in: query
          required: false
          description: Only the literal lowercase true or false is accepted; filters the stored designation.
          schema:
            type: boolean
        - name: asOfDate
          in: query
          required: false
          description: Strict ISO YYYY-MM-DD calendar date; defaults to one UTC date captured for this request.
          schema:
            type: string
            format: date
        - name: includeExpired
          in: query
          required: false
          description: Literal lowercase true or false; default false excludes already ended records.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/NationalityCursorQuery'
        - $ref: '#/components/parameters/NationalityLimitQuery'
      responses:
        '200':
          description: Complete count and one bounded page from a consistent read
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessIdEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalityCollectionApiResponse'
              examples:
                empty:
                  value:
                    status: 200
                    code: successful
                    data: []
                    nextCursor: null
                    prevCursor: null
                    totalElements: 0
                    totalPages: 0
                    numberOfElements: 0
        '400':
          $ref: '#/components/responses/NationalityBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NationalityNotFound'
        '405':
          $ref: '#/components/responses/NationalityMethodNotAllowed'
        default:
          $ref: '#/components/responses/DefaultError'

