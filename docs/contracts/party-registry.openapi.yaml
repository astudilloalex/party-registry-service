        400 patch-property-required and an absent/null body returns 400 request-body-required.
        The resulting inclusive interval must be coherent (422 nationality-validity-invalid),
        must not overlap a same-country record (409 nationality-validity-conflict), and when primary
        must not overlap another primary (409 primary-nationality-conflict). Rejected writes preserve
        all rows and audit timestamps. Every accepted PATCH, even an unchanged value, updates the
