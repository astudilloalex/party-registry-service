    IdentifierSchemeCode:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[\s\S]*[^\x09-\x0D\x1C-\x20\u1680\u2000-\u2006\u2008-\u200A\u2028\u2029\u205F\u3000][\s\S]*$'
      description: Exact nonblank text, at most 64 Unicode code points; no trimming or case conversion.
    IdentifierSchemeReplayKey:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[\s\S]*[^\x09-\x0D\x1C-\x20\u1680\u2000-\u2006\u2008-\u200A\u2028\u2029\u205F\u3000][\s\S]*$'
    IdentifierSchemeRuleKey:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[\s\S]*[^\x09-\x0D\x1C-\x20\u1680\u2000-\u2006\u2008-\u200A\u2028\u2029\u205F\u3000][\s\S]*$'
      description: >-
        Exact nonblank versioned key, at most 64 Unicode code points. Creation, resulting DRAFT edits
        and activation admit normalizer TRIM_UPPERCASE_V1 and validators ALPHANUMERIC_V1,
        EC_NATIONAL_ID_V1 or EC_TAX_ID_V1. Unknown/case-altered keys produce semantic
        422 invalid-identifier-scheme-configuration, not a structural enum error. Historical outputs
        and ACTIVE/DEPRECATED descriptive maintenance may retain obsolete keys; no executable expressions.
    IdentifierSchemeName:
      type: string
      minLength: 1
      maxLength: 150
      pattern: '^[\s\S]*[^\x09-\x0D\x1C-\x20\u1680\u2000-\u2006\u2008-\u200A\u2028\u2029\u205F\u3000][\s\S]*$'
    IdentifierSchemeCreateRequest:
      type: object
      additionalProperties: false
      description: >-
        Closed JSON object; reject duplicate/unknown properties, nonobject bodies and token coercion.
        Required properties are nonnull/nonblank. Exact strings retain case and whitespace; limits
        count Unicode code points. Missing/null body returns request-body-required (400); missing/null/
        blank code returns identifier-scheme-code-required and oversized code identifier-scheme-code-too-long.
        Other structure/text/country/enum errors are 400 bad-request. Omitted/null description and bounds
        mean absent. requiresExpiration defaults false only when omitted and rejects null. Integral bound
        tokens are decoded exactly, without narrowing: 1..32767 and minimumLength <= maximumLength are
        semantic rules (422 identifier-scheme-length-range-invalid), whereas wrong tokens are 400 bad-request.
        Supported-rule admission is semantic 422. Country format does not require a geographic lookup.
      required:
        - code
        - issuingCountryCode
        - category
        - applicableSubjectType
        - name
        - normalizerKey
        - validatorKey
      properties:
        code:
          $ref: '#/components/schemas/IdentifierSchemeCode'
        issuingCountryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          minLength: 2
          maxLength: 2
        category:
          $ref: '#/components/schemas/IdentifierCategory'
        applicableSubjectType:
          $ref: '#/components/schemas/IdentifierSubjectType'
        name:
          $ref: '#/components/schemas/IdentifierSchemeName'
        description:
          type: string
          maxLength: 500
          nullable: true
        normalizerKey:
          $ref: '#/components/schemas/IdentifierSchemeRuleKey'
        validatorKey:
          $ref: '#/components/schemas/IdentifierSchemeRuleKey'
        minimumLength:
          type: integer
          nullable: true
          minimum: 1
          maximum: 32767
        maximumLength:
          type: integer
          nullable: true
          minimum: 1
          maximum: 32767
        requiresExpiration:
          type: boolean
          default: false
          deprecated: true
          description: Legacy metadata only. Expiration is optional for every document, regardless of this value.

    IdentifierSchemeUpdateRequest:
      type: object
      additionalProperties: false
      description: >-
        Closed seven-field PATCH object; reject duplicate/unknown/immutable properties and token coercion.
        Exact text limits count Unicode code points. Omission preserves values; explicit null clears
        only description/minimumLength/maximumLength. Empty object returns patch-property-required (400).
        Missing/null body returns request-body-required (400). Integral tokens remain exact until semantic
        range/coherence validation (422); wrong tokens are 400 bad-request. DRAFT permits all seven fields
        and validates resulting supported rules. ACTIVE/DEPRECATED permit name/description only, including
        obsolete historical keys; RETIRED rejects PATCH. No identity/status/version/audit updates or replay.
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/IdentifierSchemeName'
        description:
          type: string
          maxLength: 500
          nullable: true
        normalizerKey:
          $ref: '#/components/schemas/IdentifierSchemeRuleKey'
        validatorKey:
          $ref: '#/components/schemas/IdentifierSchemeRuleKey'
        minimumLength:
          type: integer
          nullable: true
          minimum: 1
          maximum: 32767
        maximumLength:
          type: integer
          nullable: true
          minimum: 1
          maximum: 32767
        requiresExpiration:
          type: boolean
          deprecated: true
          description: Legacy metadata only. Expiration is optional for every document, regardless of this value.

    IdentifierSchemeResponse:
      type: object
      additionalProperties: false
      description: Safe global configuration and public timestamps; no audit actors. Absent nullable fields are omitted.
      required:
        - id
        - code
        - issuingCountryCode
        - category
        - applicableSubjectType
        - name
        - normalizerKey
        - validatorKey
        - requiresExpiration
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        code:
          $ref: '#/components/schemas/IdentifierSchemeCode'
        issuingCountryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          minLength: 2
          maxLength: 2
        category:
          $ref: '#/components/schemas/IdentifierCategory'
        applicableSubjectType:
          $ref: '#/components/schemas/IdentifierSubjectType'
        name:
          $ref: '#/components/schemas/IdentifierSchemeName'
        description:
          type: string
          maxLength: 500
          nullable: true
          description: Nullable stored description; omitted when absent, never emitted as null.
        normalizerKey:
          $ref: '#/components/schemas/IdentifierSchemeRuleKey'
        validatorKey:
          $ref: '#/components/schemas/IdentifierSchemeRuleKey'
        minimumLength:
          type: integer
          nullable: true
          minimum: 1
          maximum: 32767
          description: Nullable inclusive minimum; omitted when absent, never emitted as null.
        maximumLength:
          type: integer
          nullable: true
          minimum: 1
          maximum: 32767
          description: Nullable inclusive maximum; omitted when absent, never emitted as null.
        requiresExpiration:
          type: boolean
          deprecated: true
          description: Legacy metadata only; a historical true value does not make expiresOn mandatory.
        status:
          $ref: '#/components/schemas/IdentifierSchemeStatus'
        version:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    IdentifierSchemeApiResponse:
