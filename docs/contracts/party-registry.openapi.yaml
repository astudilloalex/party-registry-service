openapi: 3.0.3
info:
  title: Party Management API
  version: 1.0.0
  description: |
    Contrato completo del microservicio de Parties usando envelope ApiResponse.

    Todas las respuestas siguen el formato:
    - status
    - code
    - data (cuando aplique)

    Para listados que requieren paginación se incluyen además:
    - nextCursor
    - prevCursor
    - totalElements
    - totalPages
    - numberOfElements

    No se exponen endpoints externos para party_outbox_events.

servers:
  - url: /

tags:
  - name: natural-person
    description: Personas naturales
  - name: legal-entity
    description: Entidades legales
  - name: parties
    description: Party raíz
  - name: nationalities
    description: Nacionalidades de un party
  - name: identifier-schemes
    description: Schemes de identificación
  - name: party-identifiers
    description: Identificadores de parties
  - name: searches
    description: Búsquedas por identificador

paths:
  /v1/natural-person:
    post:
      tags:
        - natural-person
      operationId: createNaturalPerson
      summary: Crear persona natural
      description: |
        Creates a party permanently classified as `NATURAL_PERSON`, its details, and exactly one
        required initial official identifier. The identifier scheme must be `ACTIVE` and compatible
        with natural persons. The Party, details, initial identifier, and idempotency result are
        persisted atomically; if any validation or persistence step fails, none of them is created.
        The initial identifier starts in `PENDING_VERIFICATION`, and its complete value is never
        returned.
        Reusing an `Idempotency-Key` with the same effective request returns the original result;
        the effective request includes the initial identifier. Reusing the key with a different
        effective request returns `409 idempotency-key-conflict`. An already owned active identifier
        returns `409 identifier-uniqueness-conflict`.
        Text normalization does not change idempotency comparison: original submitted text is
        compared, so changing only case or surrounding whitespace still changes the request.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NaturalPersonCreateRequest'
      responses:
        '201':
          description: Persona natural e identificador inicial creados
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessIdEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NaturalPersonCreateApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        default:
          $ref: '#/components/responses/DefaultError'

  /v1/natural-person/{partyId}:
    parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProcessId'
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - natural-person
      operationId: getNaturalPerson
      summary: Obtener persona natural
      description: |
        Returns the existing natural-person fields plus the complete collection of current identifiers
        for this tenant and Party. Current identifiers have status `PENDING_VERIFICATION` or `VERIFIED`
        and an `expiresOn` value that is null or greater than or equal to one UTC evaluation date
        captured for the entire request. `EXPIRED`, `REJECTED`, and `REVOKED` identifiers are excluded,
        as are pending or verified identifiers whose expiration precedes that date.
        Includes all schemes, including metadata from deactivated (`DEPRECATED` or `RETIRED`) schemes,
        without filtering by scheme or `isPrimary`. Identifiers are ordered by `createdAt ASC`, then
        `identifierId ASC`. The collection is not truncated to 50 items and has no pagination parameters
        or additional pagination fields. A valid Party with no current identifiers returns `identifiers: []`.
        Each item reuses `PartyIdentifierResponse`, including its stored `maskedValue`; retrieval does
        not decrypt identifier values or expose plaintext, ciphertext, hashes, or encryption keys.
        An absent, cross-tenant, or wrong-type Party returns 404 natural-person-not-found.
      responses:
        '200':
          description: Detalle de persona natural
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessIdEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NaturalPersonDetailApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
    put:
      tags:
        - natural-person
      operationId: replaceNaturalPerson
      summary: Reemplazar detalle de persona natural
      description: |
        Completely replaces the natural-person details. Omitted optional fields are cleared.
        The display name is derived again whenever the submitted given or family names change.
        Stale versions return 412 expected-version-mismatch; an absent or concealed natural person
        returns 404 natural-person-not-found. Date failures use birth-date-in-future,
        date-of-death-in-future, or death-before-birth; an unrecognized changed country uses
        unrecognized-birth-country, all with HTTP 422.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NaturalPersonPutRequest'
      responses:
        '200':
          description: Detalle actualizado
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessIdEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NaturalPersonApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        default:
          $ref: '#/components/responses/DefaultError'
    patch:
      tags:
        - natural-person
      operationId: patchNaturalPerson
      summary: Actualización parcial de persona natural
      description: |
        Updates only submitted properties. Omitted properties retain their current values, while
        an explicit `null` clears a nullable property. At least one supported property is required.
        Changing given or family names derives the display name again.
        Stale versions return 412 expected-version-mismatch; an absent or concealed natural person
        returns 404 natural-person-not-found. Date failures use birth-date-in-future,
        date-of-death-in-future, or death-before-birth; an unrecognized changed country uses
        unrecognized-birth-country, all with HTTP 422.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NaturalPersonPatchRequest'
      responses:
        '200':
          description: Detalle actualizado
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessIdEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NaturalPersonApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        default:
          $ref: '#/components/responses/DefaultError'

  /v1/legal-entity:
    post:
      tags:
        - legal-entity
      operationId: createLegalEntity
      summary: Crear entidad legal
      description: |
        Creates a party permanently classified as `LEGAL_ENTITY`, its details, and exactly one
        required initial official identifier. The identifier scheme must be `ACTIVE` and compatible
        with legal entities. The Party, details, initial identifier, and idempotency result are
        persisted atomically; if any validation or persistence step fails, none of them is created.
        The initial identifier starts in `PENDING_VERIFICATION`, and its complete value is never
        returned. The initial identifier is part of the effective request protected by the
        `Idempotency-Key`.
        Reusing a key with different effective input returns 409 idempotency-key-conflict;
        an already owned active identifier returns 409 identifier-uniqueness-conflict.
        Text normalization does not change idempotency comparison: original submitted text is
        compared, so changing only case or surrounding whitespace still changes the request.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalEntityCreateRequest'
      responses:
        '201':
          description: Entidad legal e identificador inicial creados
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessIdEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalEntityCreateApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        default:
          $ref: '#/components/responses/DefaultError'

  /v1/legal-entity/{partyId}:
    parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProcessId'
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - legal-entity
      operationId: getLegalEntity
      summary: Retrieve a legal entity
      description: |
        Returns the current tenant-owned LEGAL_ENTITY, its Party identity, status, version,
        audit information, and legalEntityDetails. Absent, cross-tenant, and wrong-type Parties
        return 404 legal-entity-not-found. Retrieval preserves historical text and does not change audit
        information or versions. It requires no body, query parameters, If-Match, or Idempotency-Key.
        The response contains no initialIdentifier, identifiers collection, or pagination fields.
        Retrieval does not require Geographic Reference validation.
      responses:
        '200':
          description: Current legal-entity details
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessIdEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalEntityApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/LegalEntityNotFound'
        default:
          $ref: '#/components/responses/DefaultError'
    put:
      tags:
        - legal-entity
      operationId: replaceLegalEntity
      summary: Replace legal-entity details
      description: |
        Replaces all six legal-detail fields. Omitted optional properties are cleared.
        Legal name and incorporation country are required. A canonically changed legalName
        derives displayName again; a canonically equivalent name preserves the existing label.
        Validates resulting lifecycle dates against one UTC evaluation date. A changed canonical
        incorporationCountryCode must be recognized by Geographic Reference; equivalent codes
        require no new lookup. Failed required country validation returns 503 dependency-unavailable.
        Requires the current Party version in If-Match, but no Idempotency-Key. Stale versions
        return 412 expected-version-mismatch before semantic or country validation. Every accepted update,
        including identical input, increments the Party version exactly once and updates audit
        information atomically. Identity, type, recordStatus, identifiers, and creation snapshots
        remain unchanged. Failed updates leave no partial correction.
      parameters:
        - $ref: '#/components/parameters/LegalEntityIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalEntityPutRequest'
      responses:
        '200':
          description: Replaced legal-entity details and incremented Party version
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessIdEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalEntityApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/LegalEntityNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/LegalEntityExpectedVersionMismatch'
        '422':
          $ref: '#/components/responses/LegalEntityBusinessValidationFailure'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        default:
          $ref: '#/components/responses/DefaultError'
    patch:
      tags:
        - legal-entity
      operationId: patchLegalEntity
      summary: Partially update legal-entity details
      description: |
        Updates only submitted legal-detail properties. Omitted values retain their exact stored
        representations, while explicit null clears a nullable property. At least one supported
        property is required; unknown properties are rejected. Legal name and incorporation country
        cannot be cleared. A canonically changed legalName derives displayName again; an omitted
        or canonically equivalent name preserves the existing label.
        Validates the complete resulting lifecycle dates against one UTC evaluation date. A changed
        canonical incorporationCountryCode requires Geographic Reference validation; equivalent
        codes do not. An unrecognized country returns 422 unrecognized-incorporation-country; inability to complete
        required country validation returns 503 dependency-unavailable.
        Requires the current Party version in If-Match, but no Idempotency-Key. Stale versions
        return 412 expected-version-mismatch before semantic or country validation. Every accepted update
        increments the Party version exactly once and updates audit information atomically.
        Identity, type, recordStatus, identifiers, and creation snapshots remain unchanged.
      parameters:
        - $ref: '#/components/parameters/LegalEntityIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalEntityPatchRequest'
      responses:
        '200':
          description: Updated legal-entity details and incremented Party version
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessIdEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalEntityApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/LegalEntityNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/LegalEntityExpectedVersionMismatch'
        '422':
          $ref: '#/components/responses/LegalEntityBusinessValidationFailure'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
        default:
          $ref: '#/components/responses/DefaultError'

  /v1/parties:
    get:
      tags:
        - parties
      operationId: listParties
      summary: List tenant-owned Party summaries
      description: |
        Returns only the requesting tenant's summaries, including both types and all four record
        statuses (including ARCHIVED) when the corresponding filter is absent. Stored text, audit
        values, and versions are preserved. No If-Match or Idempotency-Key is required.
        Accepts only type, recordStatus, displayNameStartsWith, displayNameContains, createdFrom,
        createdTo, cursor, and limit, each at most once. Unknown or repeated parameters and invalid
        values return 400 bad-request; malformed filters are never silently ignored.
        All effective filters use AND semantics. Enums match exactly. Name comparison applies
        strip().toUpperCase(Locale.ROOT) to the stored name and supplied filter without rewriting
        stored values. Prefix/substring matching is literal: %, _, accents, punctuation, and interior
        whitespace retain their meaning. Empty or whitespace-only name filters are absent. Each
        decoded name filter is limited to 300 Unicode code points before normalization.
        Creation bounds are inclusive offset-qualified date-times compared as instants. Equivalent
        offsets select the same boundary; equal bounds are permitted, inverted bounds are rejected.
        Results are ordered by createdAt DESC, then canonical unsigned partyId DESC on every page,
        including backward navigation. The default limit is 50; supplied limits must be decimal
        integers from 1 through 200. Blank, fractional, negative, zero, or oversized limits are invalid.
        Opaque cursors bind the tenant, all effective filters, and page size. Canonically equivalent
        name filters and equivalent date-time offsets have the same scope. Omission requests the
        first page; empty, malformed, altered, or scope-mismatched cursors return 400 bad-request.
        Forward/backward continuation is stable on unchanged data. Separate requests see current
        data, not a retained historical snapshot; an authenticated boundary need not still match a row.
        Each response's summaries, exact totalElements, totalPages, and neighbor cursors describe
        one consistent view. Totals count all matches before continuation, totalPages is the ceiling
        of totalElements divided by the effective limit, and numberOfElements is the array length.
        Both cursor properties are always present and use explicit null for unavailable directions.
        When all matches disappear, data is [], both cursors are null, and all three counts are zero.
        An empty continuation page may still offer navigation relative to its authenticated boundary.
        Accepted Process-Id values are echoed unchanged on success and failure. Framework 404/405
        and unexpected 500 failures use the shared status/code-only error envelope.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/UserId'
        - name: type
          in: query
          required: false
          description: Exact immutable Party type; omission includes both types.
          schema:
            $ref: '#/components/schemas/PartyType'
        - name: recordStatus
          in: query
          required: false
          description: Exact lifecycle status; omission includes DRAFT, ACTIVE, INACTIVE, and ARCHIVED.
          schema:
            $ref: '#/components/schemas/PartyRecordStatus'
        - name: displayNameStartsWith
          in: query
          required: false
          allowEmptyValue: true
          description: Literal canonical prefix; at most 300 decoded Unicode code points before normalization.
          schema:
            type: string
            maxLength: 300
        - name: displayNameContains
          in: query
          required: false
          allowEmptyValue: true
          description: Literal canonical substring; at most 300 decoded Unicode code points before normalization.
          schema:
            type: string
            maxLength: 300
        - name: createdFrom
          in: query
          required: false
          description: Inclusive creation instant; an explicit UTC offset is required.
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          required: false
          description: Inclusive creation instant; an explicit UTC offset is required and the value cannot precede createdFrom.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/PartyCursorQuery'
        - $ref: '#/components/parameters/PartyLimitQuery'
      responses:
        '200':
          description: Tenant-qualified summaries and exact, snapshot-consistent pagination metadata
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessIdEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyCollectionApiResponse'
              examples:
                empty:
                  summary: No matching records
                  value:
                    status: 200
                    code: successful
                    data: []
                    nextCursor: null
                    prevCursor: null
                    totalElements: 0
                    totalPages: 0
                    numberOfElements: 0
                singlePage:
                  summary: One retained Party and no other matching records
                  value:
                    status: 200
                    code: successful
                    data:
                      - partyId: 0198ce2a-7b7d-7ab4-a5cf-4d4d7db89ab1
                        type: NATURAL_PERSON
                        displayName: Ada Lovelace
                        recordStatus: ARCHIVED
                        createdAt: '2026-09-19T12:00:00.123456Z'
                        version: 3
                    nextCursor: null
                    prevCursor: null
                    totalElements: 1
                    totalPages: 1
                    numberOfElements: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/DefaultError'

  /v1/parties/search/by-identifier:
    post:
      tags:
        - searches
      operationId: searchPartyByIdentifier
      summary: Buscar party por identificador exacto
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierSearchExactRequest'
      responses:
        '200':
          description: Resultados de búsqueda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierSearchApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/DefaultError'

  /v1/parties/search/by-identifier-prefix:
    post:
      tags:
        - searches
      operationId: searchPartyByIdentifierPrefix
      summary: Buscar parties por prefijo de identificador
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierSearchPrefixRequest'
      responses:
        '200':
          description: Resultados de búsqueda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierSearchApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/DefaultError'

  /v1/parties/{partyId}:
    parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProcessId'
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - parties
      operationId: getParty
      summary: Retrieve the common Party detail representation
      description: |
        Returns a tenant-owned Party in DRAFT, ACTIVE, INACTIVE, or ARCHIVED, preserving its stored
        historical text, version, and audit values. No If-Match or Idempotency-Key is required;
        retrieval does not depend on Geographic Reference validation.
        Includes partyId, type, displayName, recordStatus, version, createdAt, updatedAt, createdBy,
        updatedBy, and exactly the matching naturalPersonDetails or legalEntityDetails property.
        Excludes initialIdentifier, identifier collections, nationality collections, tenantId,
        pagination properties, and all protected identifier values, hashes, ciphertext, or keys.
        A noncanonical lowercase UUID returns 400 party-id-invalid. An absent or cross-tenant
        Party returns the same 404 party-not-found without disclosing its owner, type, or version.
        An accepted Process-Id is echoed unchanged on success and failure. Framework 404/405 and
        unexpected 500 failures use the shared status/code-only error envelope.
      responses:
        '200':
          description: Current safe Party details with exactly the immutable type's detail property
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessIdEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyDetailApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PartyNotFound'
        default:
          $ref: '#/components/responses/DefaultError'
    patch:
      tags:
        - parties
      operationId: updateParty
      summary: Correct a Party display name
      description: |
        Accepts exactly one supported string property, displayName, in a JSON object. Missing or
        null bodies return 400 request-body-required; missing/null displayName returns
        400 display-name-required. Malformed JSON, non-object bodies, duplicate/unknown properties,
        and incompatible property types return 400 bad-request without scalar coercion.
        Validates trusted context first, then body syntax/required value/normalized maximum length,
        then canonical partyId, then If-Match. Applicable framework checks retain their precedence.
        Normalization uses strip().toUpperCase(Locale.ROOT), retaining accents, punctuation, and
        interior whitespace. More than 300 normalized UTF-16 code units returns
        400 display-name-too-long. An empty or whitespace-only string remains structurally valid
        until business validation and then returns 422 blank-display-name.
        Business failures are evaluated in order: tenant-scoped absence (404 party-not-found),
        expected-version mismatch (412 expected-version-mismatch), then blank-display-name.
        A lost concurrent update also returns 412 expected-version-mismatch.
        A correction is permitted in DRAFT, ACTIVE, INACTIVE, and ARCHIVED. Every accepted write,
        including identical canonical input, advances the Party version exactly once and records
        the requesting User-Id and update time. Identity, type, status, subtype details, independent
        identifiers, nationalities, creation audit values, and registration replay results are preserved.
        Enabled events and the accepted mutation are atomic; a failed attempt leaves no partial outcome.
        Idempotency-Key is not required and supplying it does not enable lifecycle replay for PATCH.
        The response uses the safe root detail representation and echoes the current accepted Process-Id.
      parameters:
        - $ref: '#/components/parameters/PartyIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyUpdateRequest'
      responses:
        '200':
          description: Corrected display name, update audit information, and exactly one version increment
          headers:
            Process-Id:
              $ref: '#/components/headers/ProcessIdEcho'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyDetailApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PartyNotFound'
        '412':
