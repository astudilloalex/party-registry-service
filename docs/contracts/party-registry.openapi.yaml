openapi: 3.0.3
info:
  title: Party Management API
  version: 1.0.0
  description: |
    Contrato completo para el microservicio de Parties.

    Consideraciones:
    - Microservicio interno.
    - Tenant-Id, Process-Id y User-Id son obligatorios.
    - No se exponen endpoints externos para party_outbox_events.
    - La expiración de identificadores es manejada por un JOB, no por API.
    - La búsqueda por prefijo de identificador puede requerir extensión de persistencia.
servers:
  - url: /

tags:
  - name: natural-person
    description: Personas naturales
  - name: legal-entity
    description: Entidades legales
  - name: parties
    description: Party raíz
  - name: nationalities
    description: Nacionalidades de un party
  - name: identifier-schemes
    description: Schemes de identificación
  - name: party-identifiers
    description: Identificadores de parties
  - name: searches
    description: Búsquedas por identificador

paths:
  /v1/natural-person:
    post:
      tags:
        - natural-person
      operationId: createNaturalPerson
      summary: Crear persona natural
      description: |
        Crea un party de tipo NATURAL_PERSON junto con su detalle.
        El party se crea inicialmente en DRAFT.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NaturalPersonCreateRequest'
      responses:
        '201':
          description: Persona natural creada
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NaturalPersonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/natural-person/{partyId}:
    parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProcessId'
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - natural-person
      operationId: getNaturalPerson
      summary: Obtener persona natural
      responses:
        '200':
          description: Detalle de persona natural
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NaturalPersonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - natural-person
      operationId: replaceNaturalPerson
      summary: Reemplazar detalle de persona natural
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NaturalPersonPutRequest'
      responses:
        '200':
          description: Detalle actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NaturalPersonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - natural-person
      operationId: patchNaturalPerson
      summary: Actualización parcial de persona natural
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NaturalPersonPatchRequest'
      responses:
        '200':
          description: Detalle actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NaturalPersonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/legal-entity:
    post:
      tags:
        - legal-entity
      operationId: createLegalEntity
      summary: Crear entidad legal
      description: |
        Crea un party de tipo LEGAL_ENTITY junto con su detalle.
        El party se crea inicialmente en DRAFT.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalEntityCreateRequest'
      responses:
        '201':
          description: Entidad legal creada
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalEntityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/legal-entity/{partyId}:
    parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProcessId'
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - legal-entity
      operationId: getLegalEntity
      summary: Obtener entidad legal
      responses:
        '200':
          description: Detalle de entidad legal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalEntityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - legal-entity
      operationId: replaceLegalEntity
      summary: Reemplazar detalle de entidad legal
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalEntityPutRequest'
      responses:
        '200':
          description: Detalle actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalEntityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - legal-entity
      operationId: patchLegalEntity
      summary: Actualización parcial de entidad legal
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalEntityPatchRequest'
      responses:
        '200':
          description: Detalle actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalEntityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/parties:
    get:
      tags:
        - parties
      operationId: listParties
      summary: Listar parties
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/UserId'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PartyType'
        - name: recordStatus
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PartyRecordStatus'
        - name: displayNameStartsWith
          in: query
          required: false
          schema:
            type: string
            maxLength: 300
        - name: displayNameContains
          in: query
          required: false
          schema:
            type: string
            maxLength: 300
        - name: createdFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Lista de parties
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyCollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/parties/search/by-identifier:
    post:
      tags:
        - searches
      operationId: searchPartyByIdentifier
      summary: Buscar party por identificador exacto
      description: |
        Búsqueda exacta por valor de identificador normalizado.
        El valor no se expone en respuestas; solo se usa como criterio de búsqueda.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierSearchExactRequest'
      responses:
        '200':
          description: Resultados de búsqueda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/parties/search/by-identifier-prefix:
    post:
      tags:
        - searches
      operationId: searchPartyByIdentifierPrefix
      summary: Buscar parties por prefijo de identificador
      description: |
        Búsqueda por prefijo de identificador, por ejemplo inicio de cédula.
        Puede requerir soporte adicional en persistencia.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierSearchPrefixRequest'
      responses:
        '200':
          description: Resultados de búsqueda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/parties/{partyId}:
    parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProcessId'
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - parties
      operationId: getParty
      summary: Obtener party completo
      responses:
        '200':
          description: Party completo según tipo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - parties
      operationId: updateParty
      summary: Actualizar campos básicos del party
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyUpdateRequest'
      responses:
        '200':
          description: Party actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/parties/{partyId}/activate:
    post:
      tags:
        - parties
      operationId: activateParty
      summary: Activar party
      parameters:
        - $ref: '#/components/parameters/PartyIdPath'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: Party activado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/parties/{partyId}/deactivate:
    post:
      tags:
        - parties
      operationId: deactivateParty
      summary: Desactivar party
      parameters:
        - $ref: '#/components/parameters/PartyIdPath'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: Party desactivado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/parties/{partyId}/archive:
    post:
      tags:
        - parties
      operationId: archiveParty
      summary: Archivar party
      parameters:
        - $ref: '#/components/parameters/PartyIdPath'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: Party archivado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/parties/{partyId}/nationalities:
    parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProcessId'
      - $ref: '#/components/parameters/UserId'
    post:
      tags:
        - nationalities
      operationId: createNationality
      summary: Crear nacionalidad
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NationalityCreateRequest'
      responses:
        '201':
          description: Nacionalidad creada
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - nationalities
      operationId: listNationalities
      summary: Listar nacionalidades
      parameters:
        - name: countryCode
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Z]{2}$'
        - name: isPrimary
          in: query
          required: false
          schema:
            type: boolean
        - name: asOfDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: includeExpired
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Lista de nacionalidades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalityCollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/parties/{partyId}/nationalities/{nationalityId}:
    parameters:
      - $ref: '#/components/parameters/PartyIdPath'
      - $ref: '#/components/parameters/NationalityIdPath'
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProcessId'
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - nationalities
      operationId: getNationality
      summary: Obtener nacionalidad
      responses:
        '200':
          description: Nacionalidad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - nationalities
      operationId: updateNationality
      summary: Actualizar vigencia de nacionalidad
      description: |
        No existe borrado físico. La finalización se maneja mediante validUntil.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NationalityUpdateRequest'
      responses:
        '200':
          description: Nacionalidad actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/parties/{partyId}/nationalities/{nationalityId}/set-primary:
    post:
      tags:
        - nationalities
      operationId: setPrimaryNationality
      summary: Marcar nacionalidad primaria
      parameters:
        - $ref: '#/components/parameters/PartyIdPath'
        - $ref: '#/components/parameters/NationalityIdPath'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: Nacionalidad marcada como primaria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/identifier-schemes:
    post:
      tags:
        - identifier-schemes
      operationId: createIdentifierScheme
      summary: Crear scheme de identificación
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierSchemeCreateRequest'
      responses:
        '201':
          description: Scheme creado
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierSchemeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - identifier-schemes
      operationId: listIdentifierSchemes
      summary: Listar schemes de identificación
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/UserId'
        - name: issuingCountryCode
          in: query
          required: false
          schema:
            type: string
            pattern: '^[A-Z]{2}$'
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IdentifierCategory'
        - name: applicableSubjectType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IdentifierSubjectType'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/IdentifierSchemeStatus'
        - $ref: '#/components/parameters/CursorQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Lista de schemes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierSchemeCollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/identifier-schemes/by-code/{code}:
    get:
      tags:
        - identifier-schemes
      operationId: getIdentifierSchemeByCode
      summary: Obtener scheme por código
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/UserId'
        - name: code
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: Scheme encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierSchemeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/identifier-schemes/{schemeId}:
    parameters:
      - $ref: '#/components/parameters/IdentifierSchemeIdPath'
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ProcessId'
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - identifier-schemes
      operationId: getIdentifierScheme
      summary: Obtener scheme por ID
      responses:
        '200':
          description: Scheme encontrado
          content:
            application/json:
              schema:
