      - $ref: '#/components/parameters/PartyLifecycleIfMatch'
    post:
      tags:
        - parties
      operationId: activateParty
      summary: Activate an eligible draft Party
      description: |
        Requires no body. After trusted context and applicable framework checks, validates optional
        Idempotency-Key, canonical partyId, then required If-Match, even for a potential saved replay.
        Resolves an equivalent completed keyed result or 409 idempotency-key-conflict before current
        state checks. New-operation failure precedence is tenant-scoped absence (404 party-not-found),
        version mismatch (412 stale-party-version), lifecycle (409 invalid-party-lifecycle), then
        qualifying evidence (422 missing-qualifying-identifier).
        Only DRAFT may become ACTIVE. ACTIVE, INACTIVE, and ARCHIVED reject new activation;
        reactivation is not supported. Requires an identifier owned by the same tenant and Party in
        VERIFIED status, with null expiration or expiration on/after the single UTC evaluation date,
        referencing a matching scheme applicable to this Party type or BOTH. Primary flags and
        DEPRECATED/RETIRED scheme states do not disqualify otherwise eligible evidence. Pending,
        rejected, revoked, expired, unrelated, mismatched, and incompatible evidence cannot qualify.
        Success advances the Party version once and updates audit values while preserving the label,
        subtype details, independent identifier states/versions, and registration replay results.
        The root write, successful keyed result, and enabled activation event are atomic.
        An equivalent tenant/action/key retry with the original Party ID and expected version returns
        the original 200 successful data/version/audit, even after later archival or service restart.
        Equivalent concurrent keyed requests converge on one result instead of returning a stale-version
        loser. Replay does not re-evaluate evidence or produce another mutation/event. Failed attempts
        consume no completed key. The current accepted Process-Id is echoed, while replayed audit values
        retain the original actor/time. Unkeyed or distinct-key operations use current-version arbitration.
      responses:
        '200':
          description: Accepted activation or the identical historical activation result on an equivalent keyed retry
          headers:
            Process-Id:
