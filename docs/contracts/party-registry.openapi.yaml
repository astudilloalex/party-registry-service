components:
  parameters:
    TenantId:
      name: Tenant-Id
      in: header
      required: true
      description: >-
        Trusted tenant identifier. Exactly one canonical UUID value is required.
        Failures return `tenant-id-required`, `tenant-id-duplicated`, or `tenant-id-invalid`.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    ProcessId:
      name: Process-Id
      in: header
      required: true
      description: >-
        Trusted process identifier. Exactly one canonical UUID value is required. An accepted value
        is echoed unchanged in the response.
        Failures return `process-id-required`, `process-id-duplicated`, or `process-id-invalid`.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    UserId:
      name: User-Id
      in: header
      required: true
      description: >-
        Trusted audit subject. Exactly one non-blank value without control characters is required.
        The limit is 128 Unicode code points. C0, DEL, and C1 control characters are prohibited.
        Failures return `user-id-required`, `user-id-duplicated`, `user-id-blank`,
        `user-id-too-long`, or `user-id-unsafe`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^(?=.*\S)[^\x00-\x1F\x7F-\x9F]+$'
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Exactly one non-blank idempotency key of at most 128 characters is required.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '.*\S.*'
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: When supplied, the idempotency key must be one non-blank value.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '.*\S.*'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Exactly one nonnegative decimal aggregate version is required. A syntactically valid value
        that does not equal the current version produces HTTP 412 with the operation's specific code:
        expected-version-mismatch for detail updates and stale-party-version for activation.
      schema:
        type: string
        minLength: 1
        pattern: '^(0|[1-9][0-9]*)$'
        example: '0'
    LegalEntityIfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Exactly one nonnegative decimal Party version is required, without quotes or a wildcard,
        up to 9223372036854775807. A syntactically valid stale version or a lost legal-detail
        update race produces 412 expected-version-mismatch. Missing, duplicated, malformed,
        and out-of-range values use the shared field-specific If-Match 400 codes.
      schema:
        type: string
        minLength: 1
        pattern: '^(0|[1-9][0-9]*)$'
        example: '0'
    PartyIfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Exactly one nonnegative decimal Party version from 0 through 9223372036854775807, without
        quotes, whitespace, sign, leading zeros, or wildcard. Missing, repeated, malformed, and
        overflowing values produce if-match-required, if-match-duplicated, if-match-invalid, and
        if-match-out-of-range (400). Root PATCH requires the current version; a mismatch or lost
        update race returns 412 expected-version-mismatch before blank-name business validation.
      schema:
        type: string
        pattern: '^(0|[1-9][0-9]*)$'
        example: '0'
    PartyLifecycleIfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Exactly one nonnegative decimal Party version from 0 through 9223372036854775807, without
        quotes, whitespace, sign, leading zeros, or wildcard. Syntax is validated even for replay.
        Missing, repeated, malformed, and overflowing values produce if-match-required,
        if-match-duplicated, if-match-invalid, and if-match-out-of-range (400). New lifecycle actions
        require the current version or return 412 stale-party-version. An equivalent completed keyed
        retry instead uses the original expected version and returns its historical successful result.
      schema:
        type: string
        pattern: '^(0|[1-9][0-9]*)$'
        example: '0'
    PartyLifecycleIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional, exactly one nonblank value of at most 128 Unicode code points, compared exactly
        without trimming or case conversion. Repeated, blank, and oversized values produce
        idempotency-key-duplicated, idempotency-key-blank, and idempotency-key-too-long (400).
        Scope is tenant and lifecycle action, independent of registration and other actions. Effective
        request identity consists of Party ID and expected version, excluding User-Id and Process-Id.
        Reusing a completed key with different effective input returns 409 idempotency-key-conflict
        before current-state checks, including concurrent requests targeting different Parties.
        Equivalent successful retries return the original safe result across changes and restarts;
        failed attempts consume no key. An absent key supplies no replay behavior.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '.*\S.*'
    PartyIdPath:
      name: partyId
      in: path
      required: true
      description: Canonical lowercase Party UUID; invalid syntax returns 400 party-id-invalid.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    NationalityIdPath:
      name: nationalityId
      in: path
      required: true
      description: Full UUID nationality identifier; invalid format returns 400 bad-request.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    NationalityCreateIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Exactly one nonblank key of at most 128 Unicode code points, without trimming or case
        conversion. Missing, repeated, blank and oversized keys return idempotency-key-required,
        idempotency-key-duplicated, idempotency-key-blank and idempotency-key-too-long (400).
        Tenant/create-action-scoped completed results survive retries and restarts; changed effective
        input returns 409 idempotency-key-conflict. Failed attempts consume no key.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '.*\S.*'
    NationalityPrimaryIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional, exactly one nonblank value of at most 128 Unicode code points, compared without
        trimming or case conversion. Repeated, blank and oversized values return the shared
        idempotency-key-duplicated, idempotency-key-blank and idempotency-key-too-long (400).
        Tenant/set-primary-action-scoped completed results survive changes and restarts; changed
        Party or nationality ID returns 409 idempotency-key-conflict. Failed attempts consume no key.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '.*\S.*'
    NationalityCursorQuery:
      name: cursor
      in: query
      required: false
      description: >-
        One opaque signed continuation scoped to tenant, Party, normalized country/primary/expired
        filters, one effective UTC asOfDate, and limit. Omit for the first page. Blank, repeated,
        altered, cross-scope, and root-Party cursors return 400 bad-request.
      schema:
        type: string
        minLength: 1
    NationalityLimitQuery:
      name: limit
      in: query
      required: false
      description: >-
        One decimal integer from 1 through 200; defaults to 50 only when absent. Blank,
        repeated, fractional, zero, negative and oversized values return 400 bad-request.
        The effective limit is part of the signed cursor scope.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdentifierSchemeIdPath:
      name: schemeId
      in: path
      required: true
      description: Canonical lowercase global scheme UUID, without trimming; invalid syntax returns 400 identifier-scheme-id-invalid.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        example: '01950000-0000-7000-8000-000000000001'
    IdentifierSchemeCodePath:
      name: code
      in: path
      required: true
      description: >-
        Exact decoded, case-sensitive global code, without trimming or uppercasing. Nonblank, at most
        64 Unicode code points. Blank/oversized values return identifier-scheme-code-required or
        identifier-scheme-code-too-long (400). A valid absent value returns identifier-scheme-not-found (404).
      schema:
        $ref: '#/components/schemas/IdentifierSchemeCode'
      example: 'Example-Passport'
    IdentifierSchemeCreateKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Exactly one nonblank key of at most 128 Unicode code points, compared without trimming or case
        conversion. Missing/repeated/blank/oversized values return idempotency-key-required,
        idempotency-key-duplicated, idempotency-key-blank, idempotency-key-too-long (400).
        Scope is tenant/create/key, independent of Party and every lifecycle action. Effective input is
        all accepted create properties; omitted/null description and bounds are equivalent, omitted
        requiresExpiration equals false. Other text/values are exact. JSON order, User-Id and Process-Id
        do not affect equivalence. Equivalent completed replay returns original 201 DRAFT/version 0 and
        timestamps across later mutations and restart; changed input returns 409 idempotency-key-conflict
        before uniqueness/configuration. Failed attempts consume no key. Retry still validates all syntax.
      schema:
        $ref: '#/components/schemas/IdentifierSchemeReplayKey'
      example: 'scheme-create-example'
    IdentifierSchemeLifecycleKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional, exactly one nonblank key of at most 128 Unicode code points, compared without trimming
        or case conversion. Repeated/blank/oversized values return idempotency-key-duplicated,
        idempotency-key-blank, idempotency-key-too-long (400). Scope is tenant/action/key, independent of
        create, Party and other actions. Effective input is schemeId and expected version, excluding
        User-Id and Process-Id. Changed target/version returns 409 idempotency-key-conflict before current
        state checks. Equivalent completed replay returns original 200 data/version/timestamps after
        later changes and restart, without mutation. An absent key provides no replay; failed attempts
        consume no key. Syntax validation still precedes replay.
      schema:
        $ref: '#/components/schemas/IdentifierSchemeReplayKey'
      example: 'scheme-action-example'
    IdentifierSchemeIfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Exactly one bare decimal scheme version from 0 through 9223372036854775807, without quotes,
        whitespace, sign, leading zeros or wildcard. Missing/repeated/malformed/overflowing values return
        if-match-required, if-match-duplicated, if-match-invalid, if-match-out-of-range (400).
        New mutations require the current version; mismatch/lost independent race returns
        412 expected-version-mismatch after absence and before state/configuration. Completed keyed
        lifecycle replay instead uses its original expected version; syntax remains mandatory.
      schema:
        type: string
        pattern: '^(0|[1-9][0-9]*)$'
        minLength: 1
        maxLength: 19
      example: '0'
    IdentifierSchemeCursorQuery:
      name: cursor
      in: query
      required: false
      description: >-
        One opaque authenticated scheme-only continuation bound to tenant, all four exact filters and
        effective limit. Omit for the first page. Blank/repeated/malformed/altered/cross-scope/other-resource
        tokens return 400 bad-request. No expiration or frozen-snapshot guarantee is introduced.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    IdentifierSchemeLimitQuery:
      name: limit
      in: query
      required: false
      description: >-
        One decimal integer from 1 through 200, default 50 only when absent. Nondecimal, fractional,
        blank, repeated, zero, negative or oversized values return 400 bad-request. Authenticated in cursor scope.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PartyIdentifierIdPath:
      name: identifierId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CursorQuery:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        nullable: true
    PartyCursorQuery:
      name: cursor
      in: query
      required: false
      description: >-
        One opaque server-issued continuation scoped to tenant, effective filters, and page size.
        Omit for the first page. Empty, malformed, altered, or scope-mismatched values return
        400 bad-request. Equivalent normalized filters and equivalent offsets preserve scope.
      schema:
        type: string
        minLength: 1
    PartyLimitQuery:
      name: limit
      in: query
      required: false
      description: >-
        One decimal integer from 1 through 200; defaults to 50 only when absent. Blank, fractional,
        negative, zero, or oversized values return 400 bad-request. Included in cursor scope.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    IdentifierSchemeBadRequest:
      description: |
        Invalid scheme input; codes apply only where the named input is supported. Trusted context
        and applicable framework checks precede operation validation. Header names are case-insensitive.
        Process-Id then Tenant-Id then User-Id: absence, cardinality, value. Context UUIDs are exact
        canonical lowercase, with no trimming. User checks are blank, 128-code-point length, then safety.
        Create checks body before key; PATCH checks body before schemeId before If-Match. Lifecycle
        rejects nonzero body bytes before optional key before schemeId before If-Match. No data/errors/
        message/SQL/causes are returned. Accepted Process-Id survives all later failures unchanged;
        missing/duplicated/invalid process values are never echoed. No catalog mutation or completion.
        - process-id-required, process-id-duplicated, process-id-invalid
        - tenant-id-required, tenant-id-duplicated, tenant-id-invalid
        - user-id-required, user-id-duplicated, user-id-blank, user-id-too-long, user-id-unsafe
        - request-body-required: required create/PATCH body missing or null
        - identifier-scheme-code-required: create/code selector missing, null or blank
        - identifier-scheme-code-too-long: code exceeds 64 Unicode code points
        - identifier-scheme-id-invalid: noncanonical schemeId path value
        - patch-property-required: PATCH is an empty object
        - idempotency-key-required: create key absent
        - idempotency-key-duplicated, idempotency-key-blank, idempotency-key-too-long: supplied key invalid
        - if-match-required, if-match-duplicated, if-match-invalid, if-match-out-of-range: mutation version invalid
        - bad-request: malformed/duplicate/unknown/nonobject/coerced JSON, invalid enums/text/country,
          null nonnullable properties, wrong bound token, any nonempty lifecycle body, or unknown/
          repeated/blank/invalid list query, decimal limit or authenticated cursor/scope.
        Integral bounds out of range or incoherent instead reach semantic 422 after business precedence.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            missingProcess: { value: { status: 400, code: process-id-required } }
            duplicateProcess: { value: { status: 400, code: process-id-duplicated } }
            invalidProcess: { value: { status: 400, code: process-id-invalid } }
            missingTenant: { value: { status: 400, code: tenant-id-required } }
            duplicateTenant: { value: { status: 400, code: tenant-id-duplicated } }
            invalidTenant: { value: { status: 400, code: tenant-id-invalid } }
            missingUser: { value: { status: 400, code: user-id-required } }
            duplicateUser: { value: { status: 400, code: user-id-duplicated } }
            blankUser: { value: { status: 400, code: user-id-blank } }
            longUser: { value: { status: 400, code: user-id-too-long } }
            unsafeUser: { value: { status: 400, code: user-id-unsafe } }
            missingBody: { value: { status: 400, code: request-body-required } }
            missingCode: { value: { status: 400, code: identifier-scheme-code-required } }
            longCode: { value: { status: 400, code: identifier-scheme-code-too-long } }
            invalidId: { value: { status: 400, code: identifier-scheme-id-invalid } }
            emptyPatch: { value: { status: 400, code: patch-property-required } }
            missingKey: { value: { status: 400, code: idempotency-key-required } }
            duplicateKey: { value: { status: 400, code: idempotency-key-duplicated } }
            blankKey: { value: { status: 400, code: idempotency-key-blank } }
            longKey: { value: { status: 400, code: idempotency-key-too-long } }
            missingVersion: { value: { status: 400, code: if-match-required } }
            duplicateVersion: { value: { status: 400, code: if-match-duplicated } }
            invalidVersion: { value: { status: 400, code: if-match-invalid } }
            overflowingVersion: { value: { status: 400, code: if-match-out-of-range } }
            invalidBodyOrQuery: { value: { status: 400, code: bad-request } }
    IdentifierSchemeNotFound:
      description: Valid global scheme ID/code is absent; absence precedes expected-version/state evaluation. Unknown routes use not-found.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            absentScheme: { value: { status: 404, code: identifier-scheme-not-found } }
            unknownRoute: { value: { status: 404, code: not-found } }
    IdentifierSchemeRouteNotFound:
      description: Unknown business route. A valid empty collection is a 200 empty page, not not-found.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example: { status: 404, code: not-found }
    IdentifierSchemeCreateConflict:
      description: >-
        Completed key with changed effective input returns idempotency-key-conflict before global
        exact-code uniqueness. Existing codes in any state return identifier-scheme-code-conflict
        before semantic configuration. Equivalent completed replay instead returns original 201.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            keyConflict: { value: { status: 409, code: idempotency-key-conflict } }
            codeConflict: { value: { status: 409, code: identifier-scheme-code-conflict } }
    IdentifierSchemePatchConflict:
      description: >-
        After absence/version checks, RETIRED forbids all corrections. ACTIVE/DEPRECATED lock any
        processing-property attempt, including unchanged values. Otherwise eligible maximum-version
        changes cannot advance. Rejection changes no fields, version or audit information.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            rulesLocked: { value: { status: 409, code: identifier-scheme-rules-locked } }
            retired: { value: { status: 409, code: identifier-scheme-retired } }
            exhausted: { value: { status: 409, code: identifier-scheme-version-exhausted } }
    IdentifierSchemeLifecycleConflict:
      description: >-
        Changed target/version under a completed tenant/action/key conflicts before current-state
        checks. New actions check absence, version, transition then exhaustion. Invalid matrix entries
        are conflicts, not successful no-ops; otherwise eligible version 9223372036854775807 cannot advance.
        Rejection changes no state/configuration/version/audit or successful completion.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            keyConflict: { value: { status: 409, code: idempotency-key-conflict } }
            invalidTransition: { value: { status: 409, code: invalid-identifier-scheme-lifecycle } }
            exhausted: { value: { status: 409, code: identifier-scheme-version-exhausted } }
    IdentifierSchemeExpectedVersionMismatch:
      description: >-
        Valid expected version differs from current scheme version or loses an independent race.
        Absence precedes mismatch; state/configuration follow it. Completed equivalent keyed lifecycle
        replay instead returns the original 200 representation without reevaluating this precondition.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example: { status: 412, code: expected-version-mismatch }
    IdentifierSchemeConfigurationFailure:
      description: >-
        After applicable uniqueness/absence/version/state/exhaustion checks, resulting integral bounds
        outside 1..32767 or minimumLength greater than maximumLength return identifier-scheme-length-range-invalid.
        Unsupported exact normalizer/validator or ineligible activation configuration returns
        invalid-identifier-scheme-configuration. Wrong JSON token types are 400 instead. ACTIVE/DEPRECATED
        descriptive maintenance and withdrawal retain obsolete rules without readmission. Rejection mutates
        nothing and does not consume a successful replay key.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            bounds: { value: { status: 422, code: identifier-scheme-length-range-invalid } }
            rules: { value: { status: 422, code: invalid-identifier-scheme-configuration } }
    IdentifierSchemeUnauthorized:
      description: >-
        Conditional 401 unauthorized only when the deployment authentication profile enforces it.
        The current application/test profiles do not enable authentication; context headers are not
        an authentication provider. Preserve the existing shared challenge when enabled.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example: { status: 401, code: unauthorized }
    IdentifierSchemeMethodNotAllowed:
      description: Unsupported HTTP method, after applicable trusted-context checks.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example: { status: 405, code: method-not-allowed }
    IdentifierSchemeUnsupportedMediaType:
      description: Unsupported create/PATCH request media type; trusted context precedes later media rejection.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example: { status: 415, code: unsupported-media-type }
    IdentifierSchemeServerError:
      description: Unexpected failure or corrupted completion; logged internally and sanitized, without data/messages/SQL/causes.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example: { status: 500, code: server-error }
    IdentifierSchemeDependencyUnavailable:
      description: Classified database connection, lock, statement, query traversal or mutation operation timeout, after owned cleanup/rollback.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example: { status: 503, code: dependency-unavailable }
    BadRequest:
      description: |
        Invalid request. The error body contains only `status` and one stable `code`; it never
        includes `data`, field errors, rejected values, exception messages, or internal details.

        For deserialized body validation, rules whose codes end in `-required` take precedence,
        followed by lexicographic Jakarta Validation property path, then lexicographic rule code.
        The first violation supplies the public code. Body validation precedes operation-header
        validation. This ordering does not supersede trusted-context filters or framework checks.

        Trusted-context headers are validated before the body in this order: Process-Id, Tenant-Id,
        then User-Id. The first failing header/rule supplies the public code. Within each header,
        absence precedes duplicate detection, then value validation. Header names are case-insensitive.
        These checks do not apply to `/q` management endpoints.
        - `process-id-required`, `tenant-id-required`, `user-id-required`: the header is absent
          or has no value entry. A supplied empty string is instead validated as a blank value.
        - `process-id-duplicated`, `tenant-id-duplicated`, `user-id-duplicated`: more than one
          value is supplied for the corresponding header, even if the values are equal.
        - `process-id-invalid`, `tenant-id-invalid`: the value is blank, malformed, or not a
          canonical lowercase UUID. Whitespace is not trimmed and unresolved variables are invalid.
        - `user-id-blank`: the supplied User-Id is empty or whitespace-only.
        - `user-id-too-long`: User-Id exceeds 128 Unicode code points.
        - `user-id-unsafe`: User-Id contains a C0, DEL, or C1 control character.
        User-Id value checks run in blank, length, then control-character order.
        An accepted Process-Id is echoed even when a later header fails; missing, duplicated,
        or invalid Process-Id values are never echoed. Logs identify the fixed header name and rule,
        never the rejected value or parser exception. Only validated values enter request MDC;
        partially initialized context is also cleared when the response completes.

        Body codes apply only to the corresponding properties and operations:
        Party names, legalFormCode, and explicit displayName are validated after
        `strip().toUpperCase(Locale.ROOT)`. Their length limits count normalized UTF-16 code units,
        including uppercase expansion, not raw surrounding whitespace. Country inputs are trimmed
        with Java `String.strip()` and uppercased only when the trimmed value is exactly two ASCII
        letters. Non-ASCII country letters are rejected, even if uppercasing could expand them into
        two ASCII letters. Identifier fields and headers keep their existing raw-input limits.
        - `request-body-required`: a required request body is missing or null.
        - `display-name-required`: root Party PATCH omits displayName or supplies null; empty and
          whitespace-only strings instead reach the 422 blank-display-name business rule.
        - `display-name-too-long`: `displayName` exceeds 300 normalized UTF-16 code units on Party
          creation or root PATCH, including uppercase expansion.
        - `given-names-required`, `family-names-required`: natural-person names are missing, null,
          or blank when required; on PATCH, these rules apply only to submitted names.
        - `given-names-too-long`, `family-names-too-long`, `preferred-name-too-long`: the
          corresponding natural-person name exceeds 200 characters.
        - `birth-country-code-invalid`: a supplied `birthCountryCode` is not two ASCII letters after trimming.
        - `initial-identifier-required`: `initialIdentifier` is missing or null on Party creation.
        - `identifier-scheme-code-required`, `identifier-value-required`: `identifierSchemeCode`
          or `value` is missing, null, or blank in an initial or additional identifier.
        - `identifier-scheme-code-too-long`, `identifier-value-too-long`, `issuer-code-too-long`:
          the corresponding identifier property exceeds 64, 256, or 64 characters, respectively.
        - `legal-name-required`: `legalName` is missing, null, or blank on legal-entity creation
          or PUT; on legal-entity PATCH, this rule applies only to a submitted legalName.
        - `legal-name-invalid`: `legalName` falls outside the 1-300 character length range.
        - `trade-name-too-long`, `legal-form-code-too-long`: on legal-entity creation, PUT, or PATCH, `tradeName`
          exceeds 300 characters or `legalFormCode` exceeds 64 characters, respectively.
        - `incorporation-country-code-required`: `incorporationCountryCode` is missing or null
          on legal-entity creation or PUT, or explicitly null on legal-entity PATCH.
        - `incorporation-country-code-invalid`: on legal-entity creation, PUT, or PATCH,
          `incorporationCountryCode` is not two ASCII letters after trimming.
        - `patch-property-required`: a natural-person or legal-entity PATCH contains no supported property.
          Unknown JSON properties remain bad-request, even alongside a supported property.
        Legal-entity updates validate the normalized body before partyId and If-Match. Required
        rules use their declared JSON property paths, so a PUT body of {} reports
        incorporation-country-code-required before legal-name-required or if-match-required.
        Root Party PATCH validates context, body syntax/required value/normalized maximum length,
        canonical partyId, then If-Match. Its object supports only a string displayName; malformed
        JSON, duplicate/unknown properties, and incompatible tokens return bad-request. Its business
        precedence is absence, expected version, then blank name. Root lifecycle actions validate
        context, optional key, partyId, then If-Match before replay lookup or business evaluation.

        Path and operation-header codes apply where the corresponding input is validated:
        - `party-id-invalid`: `partyId` is not a canonical lowercase UUID.
        - `idempotency-key-required`: a required `Idempotency-Key` is absent.
        - `idempotency-key-duplicated`: more than one `Idempotency-Key` value is supplied.
        - `idempotency-key-blank`: a supplied `Idempotency-Key` is blank.
        - `idempotency-key-too-long`: `Idempotency-Key` exceeds 128 Unicode code points.
        - `if-match-required`: a required `If-Match` is absent.
        - `if-match-duplicated`: more than one `If-Match` value is supplied.
        - `if-match-invalid`: `If-Match` is blank or does not match `^(0|[1-9][0-9]*)$`.
        - `if-match-out-of-range`: a syntactically valid `If-Match` exceeds 9223372036854775807.
        Optional idempotency keys may be omitted, but supplied values must pass the same checks.

        `bad-request` remains the fallback for framework request failures and validation rules
        without a mapped public code. Natural-person JSON
        binding failures handled by the reader interceptor, including unknown properties and
        invalid JSON values, also remain `bad-request`. These validation codes do not replace
        existing framework or business error codes or change their HTTP statuses.
        Legal-entity PUT/PATCH require object bodies and strictly typed string or null properties,
        including ISO YYYY-MM-DD date strings. Incompatible scalar, array, or object property values
        and invalid date syntax are bad-request; missing or null bodies are request-body-required.
        Framework method and media-type failures retain their respective HTTP statuses, including
        405 method-not-allowed and 415 unsupported-media-type, in the same envelope.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            fallback:
              summary: Framework or natural-person JSON binding failure
              value:
                status: 400
                code: bad-request
            requiredTenant:
              summary: Process-Id is valid but Tenant-Id is missing
              value:
                status: 400
                code: tenant-id-required
            invalidProcess:
              summary: Process-Id is not a canonical lowercase UUID
              value:
                status: 400
                code: process-id-invalid
            duplicatedUser:
              summary: Process-Id and Tenant-Id are valid but User-Id appears more than once
              value:
                status: 400
                code: user-id-duplicated
            requiredBody:
              summary: Required body is missing or null
              value:
                status: 400
                code: request-body-required
            requiredDisplayName:
              summary: Root PATCH omits displayName or supplies null
              value: { status: 400, code: display-name-required }
            oversizedDisplayName:
              summary: Normalized root PATCH displayName exceeds 300 UTF-16 code units
              value: { status: 400, code: display-name-too-long }
            requiredNames:
              summary: Both names are blank; familyNames precedes givenNames by property path
              value:
                status: 400
                code: family-names-required
            initialIdentifier:
              summary: Initial identifier is missing, even if an operation header is also invalid
              value:
                status: 400
                code: initial-identifier-required
            invalidPartyId:
              summary: Party identifier is not a canonical lowercase UUID
              value:
                status: 400
                code: party-id-invalid
            requiredIdempotencyKey:
              summary: Valid body but required idempotency key is absent
              value:
                status: 400
                code: idempotency-key-required
            versionOutOfRange:
              summary: Decimal If-Match value exceeds the supported version range
              value:
                status: 400
                code: if-match-out-of-range

    Unauthorized:
      description: Falta autenticación o credenciales inválidas.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            status: 401
            code: unauthorized

    NationalityBadRequest:
      description: >-
        Only status/code are returned. Trusted context is checked Process-Id, Tenant-Id, User-Id;
        within each header absence, duplicate, then invalid value. Malformed JSON, unknown/duplicate
        properties, wrong types, invalid dates, invalid nationalityId, invalid/repeated/unknown list
        parameters and tampered cursors use bad-request. A missing/null body uses request-body-required;
        invalid create country and empty PATCH use their field-specific codes. A malformed/noncanonical
        Party UUID uses party-id-invalid; invalid operation keys use idempotency-key-* codes.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            malformed:
              value: { status: 400, code: bad-request }
            missingBody:
              value: { status: 400, code: request-body-required }
            missingCountry:
              value: { status: 400, code: country-code-required }
            invalidCountry:
              value: { status: 400, code: country-code-invalid }
            emptyPatch:
              value: { status: 400, code: patch-property-required }
            invalidPartyId:
              value: { status: 400, code: party-id-invalid }
            requiredKey:
              value: { status: 400, code: idempotency-key-required }
            duplicateKey:
              value: { status: 400, code: idempotency-key-duplicated }
            blankKey:
              value: { status: 400, code: idempotency-key-blank }
            oversizedKey:
              value: { status: 400, code: idempotency-key-too-long }

    NationalityNotFound:
      description: >-
        A missing/cross-tenant Party returns party-not-found. A record absent under an owned Party,
        belonging to another Party, or belonging to another tenant returns nationality-not-found.
        No owner or record details are exposed. An unmatched route retains framework not-found.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            party:
              value: { status: 404, code: party-not-found }
            nationality:
              value: { status: 404, code: nationality-not-found }
            route:
              value: { status: 404, code: not-found }

    NationalityConflict:
      description: >-
        Inclusive same-country overlap returns nationality-validity-conflict, and overlapping
        primary intervals return primary-nationality-conflict. A completed key reused with changed
        effective input returns idempotency-key-conflict. All rejected writes roll back completely.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            sameCountry:
              value: { status: 409, code: nationality-validity-conflict }
            primary:
              value: { status: 409, code: primary-nationality-conflict }
            idempotency:
              value: { status: 409, code: idempotency-key-conflict }

    NationalityUnprocessableEntity:
      description: >-
        An inverted interval returns nationality-validity-invalid; a definite unrecognized new
        country returns unrecognized-nationality-country; an ended or future set-primary target
        returns nationality-not-effective. Rejected attempts change no audit, version or key state.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            invalidInterval:
              value: { status: 422, code: nationality-validity-invalid }
            unrecognizedCountry:
              value: { status: 422, code: unrecognized-nationality-country }
            ineffectiveTarget:
              value: { status: 422, code: nationality-not-effective }

    NationalityMethodNotAllowed:
      description: A recognized nationality route was called with an unsupported method.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example: { status: 405, code: method-not-allowed }

    NationalityUnsupportedMediaType:
      description: The create or PATCH request body is not application/json.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example: { status: 415, code: unsupported-media-type }

    NotFound:
      description: >-
        Resource absent or concealed for the requesting tenant. Natural-person detail operations use
        natural-person-not-found; Party activation and additional identifier registration use
        party-not-found. Framework route failures retain not-found. No actual owner or type is exposed.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            naturalPerson:
              value:
                status: 404
                code: natural-person-not-found
            party:
              value:
                status: 404
                code: party-not-found
            frameworkRoute:
              value:
                status: 404
                code: not-found

    PartyNotFound:
      description: >-
        The Party is absent or belongs to another tenant. Both cases return the same result,
        without disclosing the actual tenant, immutable type, lifecycle status, or version.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            status: 404
            code: party-not-found

    PartyExpectedVersionMismatch:
      description: Root PATCH used a stale Party version or lost a concurrent update; no correction was applied.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example: { status: 412, code: expected-version-mismatch }

    PartyBlankDisplayName:
      description: >-
        The root PATCH string is blank after normalization. Checked only after tenant-scoped absence
        and expected version. The prior label, audit values, and version remain unchanged.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example: { status: 422, code: blank-display-name }

    PartyStaleVersion:
      description: >-
        A new activate, deactivate, or archive operation used a stale Party version or lost a
        concurrent version race. Equivalent completed keyed requests return their historical 200
        result before this check; genuinely stale requests leave no mutation, result, or event.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example: { status: 412, code: stale-party-version }

    PartyLifecycleConflict:
      description: >-
        A completed tenant/action/key was reused with a different Party ID or expected version
        (idempotency-key-conflict), or a new action is forbidden in the current lifecycle state
        (invalid-party-lifecycle). Key conflicts precede current-state checks; transition checks
        follow absence and version. The losing request leaves no mutation, saved result, or event.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            keyConflict:
              value: { status: 409, code: idempotency-key-conflict }
            transitionConflict:
              value: { status: 409, code: invalid-party-lifecycle }

    PartyMissingActivationEvidence:
      description: >-
        A DRAFT Party has no qualifying same-tenant, same-Party VERIFIED identifier with a matching,
        compatible scheme and null or unexpired expiration. Checked after absence, version, and
        lifecycle. The failed attempt changes no Party fields and consumes no successful replay key.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example: { status: 422, code: missing-qualifying-identifier }

    LegalEntityNotFound:
      description: >-
        The requested legal entity is absent, belongs to a different tenant, or the Party is not
        classified as LEGAL_ENTITY. All three cases return the same cause-specific code without
        exposing the actual owner, type, details, or version.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            status: 404
            code: legal-entity-not-found

    LegalEntityExpectedVersionMismatch:
      description: >-
        The valid If-Match value differs from the current Party version, or the legal-detail
        update lost a concurrent version race. No part of the rejected update is applied.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            status: 412
            code: expected-version-mismatch

    LegalEntityBusinessValidationFailure:
      description: |
        A known legal-detail business rule failed. The code identifies the specific cause:
        - unrecognized-incorporation-country: Geographic Reference definitively does not recognize
          the changed canonical incorporation country.
        - dissolution-before-incorporation: both resulting dates are present and dissolution
          precedes incorporation.
        - incorporation-date-in-future: the resulting incorporation date exceeds the UTC evaluation date.
        - dissolution-date-in-future: the resulting dissolution date exceeds the UTC evaluation date.
        Date ordering is checked before incorporation in the future, then dissolution in the future.
        All date checks precede changed-country validation. The rejected request changes no fields,
        audit values, or Party version. Technical dependency failures instead return 503.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            unrecognizedCountry:
              value:
                status: 422
                code: unrecognized-incorporation-country
            dissolutionBeforeIncorporation:
              value:
                status: 422
                code: dissolution-before-incorporation
            incorporationInFuture:
              value:
                status: 422
                code: incorporation-date-in-future
            dissolutionInFuture:
              value:
                status: 422
                code: dissolution-date-in-future

    Conflict:
      description: >-
        Business conflict. Changed effective registration input for a reused key produces
        idempotency-key-conflict; a duplicate active identifier produces identifier-uniqueness-conflict;
        an invalid activation transition produces invalid-party-lifecycle. Each retains HTTP 409.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            idempotency:
              value:
                status: 409
                code: idempotency-key-conflict
            identifierUniqueness:
              value:
                status: 409
                code: identifier-uniqueness-conflict
            lifecycle:
              value:
                status: 409
                code: invalid-party-lifecycle

    PreconditionFailed:
      description: >-
        The valid If-Match version does not equal the current aggregate version. Detail updates use
        expected-version-mismatch; activation uses stale-party-version. A rejected write is not applied.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            details:
              value:
                status: 412
                code: expected-version-mismatch
            activation:
              value:
                status: 412
                code: stale-party-version

    UnprocessableEntity:
      description: |
        A known business rule failed. Codes apply only to fields and operations that use that rule:
        - Natural-person dates: birth-date-in-future, date-of-death-in-future, death-before-birth.
        - Legal-entity dates: incorporation-date-in-future, dissolution-date-in-future,
          dissolution-before-incorporation.
        - Unrecognized countries: unrecognized-birth-country or unrecognized-incorporation-country.
        - Blank explicit registration display name: blank-display-name.
        - Identifier scheme eligibility: unknown-identifier-scheme, inactive-identifier-scheme,
          incompatible-identifier-scheme.
        - Identifier value/validity rules: identifier-validation-failure.
        - Activation without qualifying verified evidence: missing-qualifying-identifier.
        Technical dependency failures instead use 503 dependency-unavailable.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            birthInFuture:
              value: { status: 422, code: birth-date-in-future }
            deathInFuture:
              value: { status: 422, code: date-of-death-in-future }
            deathBeforeBirth:
              value: { status: 422, code: death-before-birth }
            incorporationInFuture:
              value: { status: 422, code: incorporation-date-in-future }
            dissolutionInFuture:
              value: { status: 422, code: dissolution-date-in-future }
            dissolutionBeforeIncorporation:
              value: { status: 422, code: dissolution-before-incorporation }
            birthCountry:
              value: { status: 422, code: unrecognized-birth-country }
            incorporationCountry:
              value: { status: 422, code: unrecognized-incorporation-country }
            blankDisplayName:
              value: { status: 422, code: blank-display-name }
            unknownScheme:
              value: { status: 422, code: unknown-identifier-scheme }
            inactiveScheme:
              value: { status: 422, code: inactive-identifier-scheme }
            incompatibleScheme:
              value: { status: 422, code: incompatible-identifier-scheme }
            identifierValue:
              value: { status: 422, code: identifier-validation-failure }
            missingEvidence:
              value: { status: 422, code: missing-qualifying-identifier }

    DependencyUnavailable:
      description: Geographic Reference Service validation could not be completed.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            status: 503
            code: dependency-unavailable

    DefaultError:
      description: Error inesperado.
      headers:
        Process-Id:
          $ref: '#/components/headers/ProcessIdEcho'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          example:
            status: 500
            code: server-error

