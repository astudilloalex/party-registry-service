    PartyCollectionApiResponse:
      type: object
      additionalProperties: false
      description: >-
        Exact tenant/filter totals and summaries from one consistent view. Counts are never null.
        Unavailable cursor directions are explicit nulls; an empty matching dataset has all counts
        zero. The current shared response implementation supports counts up to 2147483647;
        unrepresentable counts produce a sanitized technical failure rather than partial totals.
      required:
        - status
        - code
        - data
        - nextCursor
        - prevCursor
        - totalElements
        - totalPages
        - numberOfElements
      properties:
        status:
          type: integer
          enum: [200]
        code:
          $ref: '#/components/schemas/ApiSuccessCode'
        data:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/PartySummary'
        nextCursor:
          type: string
          nullable: true
          description: Next-page continuation, or explicit null when unavailable.
        prevCursor:
          type: string
          nullable: true
          description: Previous-page continuation, or explicit null when unavailable.
        totalElements:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Exact number of tenant/filter matches before applying the cursor boundary.
        totalPages:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Ceiling of totalElements divided by the effective limit; zero for no matches.
        numberOfElements:
          type: integer
          format: int32
          minimum: 0
          maximum: 200
          description: Number of summaries in this response's data array.

    PartyUpdateRequest:
      type: object
      additionalProperties: false
      description: >-
        Strict root display-name correction. Only the required string displayName is accepted;
        unknown or duplicate properties and non-string tokens are bad-request. Missing/null body
        is request-body-required; missing/null displayName is display-name-required (all HTTP 400).
        An empty or whitespace-only string is rejected later as 422 blank-display-name, after
        tenant-scoped absence and expected-version checks. The display name
        accepts mixed case and surrounding whitespace removed by Java String.strip()
        (Character.isWhitespace), then is stored as strip().toUpperCase(Locale.ROOT).
        The x-normalized-max-length limit counts normalized UTF-16 code units, not raw input,
        including uppercase expansion; excess length is 400 display-name-too-long during body validation.
        Accents, punctuation, and interior whitespace are preserved. Corrections are permitted in all
        four statuses, including ARCHIVED; identical canonical writes still advance the version once.
      required:
        - displayName
      properties:
        displayName:
          type: string
          x-normalized-max-length: 300

    NationalityCreateRequest:
      type: object
      additionalProperties: false
      description: >-
        Strict JSON object. Duplicate/unknown fields and wrong JSON scalar types return 400 bad-request.
        countryCode is a required nonnull string. Omitted isPrimary defaults to false; explicit null
        is invalid. Omitted/null dates mean open bounds; supplied values must be ISO YYYY-MM-DD
        calendar dates. Validity and overlap rules are evaluated after structural and path/key checks.
      required:
        - countryCode
      properties:
        countryCode:
          type: string
          nullable: false
          description: >-
            Accepts exactly two ASCII letters in either case, optionally surrounded by Java
            String.strip() whitespace (Character.isWhitespace). Stored as two uppercase ASCII
            letters after trimming; non-ASCII letters and embedded whitespace are invalid.
            The normalized length is exactly two; raw input may be longer due to surrounding whitespace.
          pattern: '^[\u0009-\u000D\u001C-\u0020\u1680\u2000-\u2006\u2008-\u200A\u2028-\u2029\u205F\u3000]*[A-Za-z]{2}[\u0009-\u000D\u001C-\u0020\u1680\u2000-\u2006\u2008-\u200A\u2028-\u2029\u205F\u3000]*$'
          minLength: 2
          x-normalized-max-length: 2
        isPrimary:
          type: boolean
          nullable: false
          default: false
        validFrom:
          type: string
          format: date
          nullable: true
        validUntil:
          type: string
          format: date
          nullable: true

    NationalityUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 2
      description: >-
        Strict presence-aware PATCH object. At least one of validFrom/validUntil must be supplied
        (400 patch-property-required); omitted means retain and explicit null clears that bound.
        Duplicate/unknown properties, wrong types and invalid ISO calendar dates use 400 bad-request.
      properties:
        validFrom:
          type: string
          format: date
          nullable: true
        validUntil:
          type: string
          format: date
          nullable: true

    NationalityResponse:
      type: object
      additionalProperties: false
      description: >-
        Detached stored nationality without tenant identity, Party lifecycle, storage internals, or
        pagination. Null validity bounds may be omitted. All audit timestamps are retained on replay.
      required:
        - nationalityId
        - partyId
        - countryCode
        - isPrimary
        - createdAt
        - updatedAt
      properties:
        nationalityId:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          minLength: 2
          maxLength: 2
        isPrimary:
          type: boolean
        validFrom:
          type: string
          format: date
          nullable: true
        validUntil:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    NationalityApiResponse:
