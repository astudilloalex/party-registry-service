      properties:
        displayName:
          type: string
          x-normalized-max-length: 300
          nullable: true
        givenNames:
          type: string
          minLength: 1
          x-normalized-max-length: 200
          pattern: '.*\S.*'
        familyNames:
          type: string
          minLength: 1
          x-normalized-max-length: 200
          pattern: '.*\S.*'
        preferredName:
          type: string
          x-normalized-max-length: 200
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        dateOfDeath:
          type: string
          format: date
          nullable: true
        birthCountryCode:
