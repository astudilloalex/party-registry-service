      description: >-
        Creates a global catalog entry in DRAFT, version 0, with generated identity and equal
        createdAt/updatedAt. Exactly one Process-Id, Tenant-Id, and User-Id is validated in that
        order before operation input; canonical lowercase UUIDs are not trimmed. Header names
        are case-insensitive. User-Id is nonblank, at most 128 Unicode code points, with no C0/DEL/C1
        controls. Accepted Process-Id is echoed unchanged on every success/error/replay, even after
        later context failure; missing/duplicated/invalid process values are not echoed. /q is exempt.
        Strict body validation precedes the required Idempotency-Key. Completed equivalent replay
        returns the original 201 DRAFT/version-zero/timestamps across later changes and restart;
        changed effective input returns 409 idempotency-key-conflict before global exact-code
        uniqueness, then semantic bounds and supported-rule admission. Codes remain assigned in
        every lifecycle state. Tenant context scopes replay, never catalog ownership. Country
        validation is local format validation only. Client IDs, versions, statuses and audits are forbidden.
