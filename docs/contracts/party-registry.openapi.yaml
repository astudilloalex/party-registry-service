    post:
      tags:
        - party-identifiers
      operationId: createPartyIdentifier
      summary: Crear identificador
      description: |
        Crea un identificador para un party.
        El servicio normaliza, valida, encripta, hashea y enmascara el valor.
        No se permite actualizar el valor posteriormente.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
