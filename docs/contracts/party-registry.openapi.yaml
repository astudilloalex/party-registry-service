components:
  parameters:
    TenantId:
      name: Tenant-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ProcessId:
      name: Process-Id
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    UserId:
      name: User-Id
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Versión actual del recurso para control de concurrencia optimista.
      schema:
        type: string
    PartyIdPath:
      name: partyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NationalityIdPath:
      name: nationalityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdentifierSchemeIdPath:
      name: schemeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PartyIdentifierIdPath:
      name: identifierId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CursorQuery:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        nullable: true
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    BadRequest:
      description: Solicitud inválida, headers faltantes o validación de formato.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado para el tenant indicado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicto de negocio, duplicidad o transición inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionFailed:
      description: La versión enviada en If-Match no coincide con la actual.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: La solicitud es sintácticamente válida pero rompe reglas de negocio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Error interno del servicio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: El payload no cumple las reglas de negocio.
        traceId:
          type: string
          example: 01900000-0000-7000-8000-000000000000
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          example: displayName
        message:
          type: string
          example: displayName no puede estar vacío.

    PartyType:
      type: string
      enum:
        - NATURAL_PERSON
        - LEGAL_ENTITY

    PartyRecordStatus:
      type: string
      enum:
        - DRAFT
        - ACTIVE
        - INACTIVE
        - ARCHIVED

    IdentifierCategory:
      type: string
      enum:
        - NATIONAL_ID
        - TAX_ID
        - PASSPORT
        - RESIDENCE_PERMIT
        - LEGAL_REGISTRATION_NUMBER
        - OTHER

    IdentifierSubjectType:
      type: string
      enum:
        - NATURAL_PERSON
        - LEGAL_ENTITY
        - BOTH

    IdentifierSchemeStatus:
      type: string
      enum:
        - DRAFT
        - ACTIVE
        - DEPRECATED
        - RETIRED

    PartyIdentifierStatus:
      type: string
      enum:
        - PENDING_VERIFICATION
        - VERIFIED
        - REJECTED
        - EXPIRED
        - REVOKED

    PartyBase:
      type: object
      required:
        - partyId
        - type
        - displayName
        - recordStatus
        - version
        - createdAt
        - updatedAt
        - createdBy
        - updatedBy
      properties:
        partyId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/PartyType'
        displayName:
          type: string
          minLength: 1
          maxLength: 300
        recordStatus:
          $ref: '#/components/schemas/PartyRecordStatus'
        version:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          maxLength: 128
        updatedBy:
          type: string
          maxLength: 128

    PartySummary:
      type: object
      required:
        - partyId
        - type
        - displayName
        - recordStatus
        - createdAt
        - version
      properties:
        partyId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/PartyType'
        displayName:
          type: string
        recordStatus:
          $ref: '#/components/schemas/PartyRecordStatus'
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64

    PartyCollectionResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PartySummary'
        nextCursor:
          type: string
          nullable: true

    NaturalPersonDetails:
      type: object
      required:
        - givenNames
        - familyNames
      properties:
        givenNames:
          type: string
          minLength: 1
          maxLength: 200
        familyNames:
          type: string
          minLength: 1
          maxLength: 200
        preferredName:
          type: string
          maxLength: 200
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        dateOfDeath:
          type: string
          format: date
          nullable: true
        birthCountryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          minLength: 2
          maxLength: 2
          nullable: true

    NaturalPersonCreateRequest:
      type: object
      required:
        - givenNames
        - familyNames
      properties:
        displayName:
          type: string
          maxLength: 300
          nullable: true
          description: Si no se envía, puede derivarse de givenNames y familyNames.
        givenNames:
          type: string
          minLength: 1
          maxLength: 200
        familyNames:
          type: string
          minLength: 1
          maxLength: 200
        preferredName:
          type: string
          maxLength: 200
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        dateOfDeath:
          type: string
          format: date
          nullable: true
        birthCountryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          minLength: 2
          maxLength: 2
          nullable: true

    NaturalPersonPutRequest:
      type: object
      required:
        - givenNames
        - familyNames
      properties:
        givenNames:
          type: string
          minLength: 1
          maxLength: 200
        familyNames:
          type: string
          minLength: 1
          maxLength: 200
        preferredName:
          type: string
          maxLength: 200
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        dateOfDeath:
          type: string
          format: date
          nullable: true
        birthCountryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          minLength: 2
          maxLength: 2
          nullable: true

    NaturalPersonPatchRequest:
      type: object
      minProperties: 1
      properties:
        givenNames:
          type: string
          minLength: 1
          maxLength: 200
        familyNames:
          type: string
          minLength: 1
          maxLength: 200
        preferredName:
          type: string
          maxLength: 200
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        dateOfDeath:
          type: string
          format: date
          nullable: true
        birthCountryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          minLength: 2
          maxLength: 2
          nullable: true

    NaturalPersonResponse:
      allOf:
        - $ref: '#/components/schemas/PartyBase'
        - type: object
          required:
            - naturalPersonDetails
          properties:
            naturalPersonDetails:
              $ref: '#/components/schemas/NaturalPersonDetails'

    LegalEntityDetails:
      type: object
      required:
        - legalName
        - incorporationCountryCode
      properties:
        legalName:
          type: string
          minLength: 1
          maxLength: 300
        tradeName:
          type: string
          maxLength: 300
          nullable: true
        legalFormCode:
          type: string
          maxLength: 64
          nullable: true
        incorporationCountryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          minLength: 2
          maxLength: 2
        incorporatedOn:
          type: string
          format: date
          nullable: true
        dissolvedOn:
          type: string
          format: date
          nullable: true

    LegalEntityCreateRequest:
      type: object
      required:
        - legalName
        - incorporationCountryCode
      properties:
        displayName:
          type: string
          maxLength: 300
          nullable: true
          description: Si no se envía, puede derivarse de legalName o tradeName.
        legalName:
          type: string
          minLength: 1
          maxLength: 300
        tradeName:
          type: string
          maxLength: 300
          nullable: true
        legalFormCode:
          type: string
          maxLength: 64
          nullable: true
        incorporationCountryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          minLength: 2
          maxLength: 2
        incorporatedOn:
          type: string
          format: date
          nullable: true
        dissolvedOn:
          type: string
          format: date
          nullable: true

    LegalEntityPutRequest:
      type: object
      required:
        - legalName
        - incorporationCountryCode
      properties:
        legalName:
          type: string
          minLength: 1
          maxLength: 300
        tradeName:
          type: string
          maxLength: 300
          nullable: true
        legalFormCode:
          type: string
          maxLength: 64
          nullable: true
        incorporationCountryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          minLength: 2
          maxLength: 2
        incorporatedOn:
          type: string
          format: date
          nullable: true
        dissolvedOn:
          type: string
          format: date
          nullable: true

    LegalEntityPatchRequest:
      type: object
      minProperties: 1
      properties:
        legalName:
          type: string
          minLength: 1
          maxLength: 300
        tradeName:
          type: string
          maxLength: 300
          nullable: true
        legalFormCode:
          type: string
          maxLength: 64
          nullable: true
